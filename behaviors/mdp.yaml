# Humboldt Behavior MDP — Markov Decision Process graph
#
# Speculative initial weights (2026-06-09). Adjust via `humboldt behaviors admin`.
# Supervisory loop learns from behaviors/log.jsonl.
#
# Edge semantics:
#   weight      — unnormalized influence weight; normalized per source at runtime
#   bidirectional — true = within-phase (same weight both directions); false = one-way
#   cross_phase — true = inter-phase transition (forward only)
#   cycle_back  — true = retrospective → liminal arc-restart edge
#
# Constraint: within each phase, no absorbing states (every node has ≥1 within-phase
# outgoing edge). Phase stuckness is allowed; permanent node stuckness is not.
# Full graph is connected via the retrospective → liminal cycle-back.

version: 1

# ── Phase definitions ────────────────────────────────────────────────────────

phases:
  - id: liminal
    name: Liminal Passage
    order: 0
    color: "#8b949e"
    description: Between arcs — wandering, building analogy capacity, reorienting.

  - id: exploration
    name: Exploration
    order: 1
    color: "#58a6ff"
    description: Active curiosity — random links, deep reads, field observation, social input.

  - id: sensemaking
    name: Sensemaking
    order: 2
    color: "#bc8cff"
    description: Pattern recognition — thought experiments, visualization, estimation.

  - id: valley
    name: Valley
    order: 3
    color: "#3fb950"
    description: Candidate law development — stress-testing, design fiction, iteration.

  - id: heavy_lift
    name: Heavy Lift
    order: 4
    color: "#f78166"
    description: Theory synthesis. No behaviors implemented yet.

  - id: retrospective
    name: Retrospective
    order: 5
    color: "#f1e05a"
    description: Falsification monitoring. No behaviors implemented yet.

  - id: daemon
    name: Daemon
    order: -1
    color: "#3fb950"
    description: Always-on background processes. Not part of research phase flow.

# ── Virtual nodes for phases with no implemented behaviors ───────────────────

virtual_nodes:
  - id: hl-placeholder
    name: Heavy Lift (TBD)
    phase: heavy_lift
    state: placeholder
    description: No behaviors implemented for this phase yet. Represents the heavy synthesis work needed to move from candidate law to theory.

  - id: re-placeholder
    name: Retrospective (TBD)
    phase: retrospective
    state: placeholder
    description: No behaviors implemented for this phase yet. Represents falsification monitoring and arc closing.

