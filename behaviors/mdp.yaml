# Humboldt Behavior MDP — transition graph
#
# Rewritten 2026-09-01 (redesign Phase 3) for the pruned 12-behavior registry.
# Version 1 described the 26-behavior wander-space: 28 nodes, 72 mostly-bidirectional
# edges, and two virtual placeholder nodes standing in for the empty heavy_lift and
# retrospective phases. That graph modelled a researcher browsing its own capabilities.
#
# This graph models a funnel. Consequences, all deliberate:
#
#   * Edges are directional. The old `bidirectional: true` convention is gone — material
#     moves downstream, and the few upstream edges are real feedback loops (an assessment
#     gap sending work back to reading; a monitor challenge re-opening an assessment),
#     each named as such rather than implied by symmetry.
#   * Every edge carries a `trigger` (§6.2) — a plain-language, supervisor-editable
#     condition for when it fires. An edge without a trigger is an assertion that
#     something happens for unstated reasons, which is what made v1's weights unfalsifiable.
#   * No virtual nodes. Every phase now has at least one real behavior, so the
#     hl-placeholder / re-placeholder scaffolding is deleted.
#   * v1's "no absorbing states within a phase" constraint is dropped: five of the seven
#     phases hold exactly one behavior, so within-phase cycling is not available and not
#     wanted. The graph stays connected through the retrospective -> liminal cycle-back.
#
# Edge fields:
#   from, to     behavior ids from registry.yaml
#   weight       unnormalized influence; normalized per source at runtime
#   trigger      REQUIRED — plain-language firing condition, supervisor-editable
#   cross_phase  true when `from` and `to` sit in different phases
#   cycle_back   true for the retrospective -> liminal arc-restart edges
#   feedback     true for upstream edges (downstream stage sending work back up)

version: 2

# ── Phase definitions ────────────────────────────────────────────────────────

phases:
  - id: liminal
    name: Liminal Passage
    order: 0
    color: "#8b949e"
    description: Between arcs — orientation, deciding what this session is for.

  - id: exploration
    name: Exploration
    order: 1
    color: "#58a6ff"
    description: Intake and reading — raw material in, notes and seeds out.

  - id: sensemaking
    name: Sensemaking
    order: 2
    color: "#bc8cff"
    description: Induction — seeds and reads become candidate laws.

  - id: valley
    name: Valley
    order: 3
    color: "#3fb950"
    description: Assessment — a law tested against its own advance and challenge triggers.

  - id: heavy_lift
    name: Heavy Lift
    order: 4
    color: "#f78166"
    description: Publication — the separation event, a law addressed to an audience.

  - id: retrospective
    name: Retrospective
    order: 5
    color: "#f1e05a"
    description: Monitoring and meta — falsification watch, and evolution of the graph itself.

  - id: any
    name: Out of flow
    order: -1
    color: "#6e7681"
    description: Behaviors with no fixed arc position — conversation happens at any phase.

# ── Transition graph ─────────────────────────────────────────────────────────

transitions:

  # ════════════════════════════════════════════════════════
  #  LIMINAL — orientation dispatches to a stage
  # ════════════════════════════════════════════════════════

  - from: orient
    to: triage
    weight: 0.50
    cross_phase: true
    trigger: "Orientation finds inbox depth to be the dominant backlog — more unprocessed items than the
      daily schedule will clear"

  - from: orient
    to: deep-read
    weight: 0.40
    cross_phase: true
    trigger: "Orientation selects a session deep read — the escalated queue holds a source worth full
      attention"

  - from: orient
    to: induct
    weight: 0.35
    cross_phase: true
    trigger: "Orientation finds the seed pool ready — enough unconsumed seeds that a sweep would produce
      something"

  - from: orient
    to: assess
    weight: 0.35
    cross_phase: true
    trigger: "Orientation finds a law whose advance trigger may now be within reach, or one carrying an
      unresolved counterexample"

  # ════════════════════════════════════════════════════════
  #  EXPLORATION — within-phase, the reading pipeline
  # ════════════════════════════════════════════════════════

  - from: intake
    to: triage
    weight: 0.9
    trigger: "Inbox holds items no triage report has scored"

  - from: triage
    to: shallow-read
    weight: 0.85
    trigger: "The most recent triage report has non-discard items not yet shallow-read"

  - from: triage
    to: deep-read
    weight: 0.20
    trigger: "Triage marked an item deep — high law-relevance, or a primary source a summary would waste"

  - from: shallow-read
    to: deep-read
    weight: 0.25
    trigger: "A shallow read escalated: its note says the argument needs the full text to evaluate"

  # ════════════════════════════════════════════════════════
  #  EXPLORATION → SENSEMAKING — reading becomes law material
  # ════════════════════════════════════════════════════════

  - from: shallow-read
    to: induct
    weight: 0.60
    cross_phase: true
    trigger: "Seeds accumulated past the sweep threshold (>=10 unconsumed), or the weekly induction is
      due"

  - from: deep-read
    to: induct
    weight: 0.70
    cross_phase: true
    trigger: "A deep read produced seeds or evidence the last sweep did not see"

  # ════════════════════════════════════════════════════════
  #  EXPLORATION → RETROSPECTIVE — the meta path (§5, §6.4)
  # ════════════════════════════════════════════════════════

  - from: shallow-read
    to: graph-evolve
    weight: 0.20
    cross_phase: true
    trigger: "A meta-tagged shallow read terminated in a graph-change proposal instead of a seed"

  - from: deep-read
    to: graph-evolve
    weight: 0.30
    cross_phase: true
    trigger: "A meta deep read produced a graph-change proposal — a new behavior request, trigger redefinition,
      or prompt amendment"

  # ════════════════════════════════════════════════════════
  #  SENSEMAKING → VALLEY
  # ════════════════════════════════════════════════════════

  - from: induct
    to: assess
    weight: 0.80
    cross_phase: true
    trigger: "A new law was created, or an existing law accumulated >=3 evidence attachments"

  # ════════════════════════════════════════════════════════
  #  VALLEY → HEAVY LIFT
  # ════════════════════════════════════════════════════════

  - from: assess
    to: publish
    weight: 0.55
    cross_phase: true
    trigger: "An assessment produced a law event worth announcing — a promotion, demotion, or falsification"

  # ════════════════════════════════════════════════════════
  #  VALLEY → EXPLORATION — the evidence-gap feedback loop
  # ════════════════════════════════════════════════════════

  - from: assess
    to: deep-read
    weight: 0.40
    cross_phase: true
    feedback: true
    trigger: "An assessment held with a named evidence gap, and the gap identifies a specific source that
      would close it"

  - from: assess
    to: triage
    weight: 0.20
    cross_phase: true
    feedback: true
    trigger: "An assessment held with an evidence gap no source on file addresses — the corpus needs new
      material on the question"

  # ════════════════════════════════════════════════════════
  #  HEAVY LIFT → RETROSPECTIVE
  # ════════════════════════════════════════════════════════

  - from: publish
    to: monitor
    weight: 0.60
    cross_phase: true
    trigger: "A published separation artifact moved a law to retrospective stage — it now needs a falsification
      watch"

  # ════════════════════════════════════════════════════════
  #  RETROSPECTIVE → VALLEY — challenge cycles back
  # ════════════════════════════════════════════════════════

  - from: monitor
    to: assess
    weight: 0.70
    cross_phase: true
    feedback: true
    trigger: "The monitor flagged new corpus material bearing against a retrospective law — the challenge
      needs a full assessment"

  # ════════════════════════════════════════════════════════
  #  RETROSPECTIVE — within-phase, the meta loop
  # ════════════════════════════════════════════════════════

  - from: supervisory
    to: graph-evolve
    weight: 0.50
    trigger: "The weekly sweep raised a prune, split, or stall flag against a behavior"

  # ════════════════════════════════════════════════════════
  #  RETROSPECTIVE → LIMINAL — cycle-back, closes the graph
  # ════════════════════════════════════════════════════════

  - from: graph-evolve
    to: orient
    weight: 0.40
    cross_phase: true
    cycle_back: true
    trigger: "An approved graph change altered the registry — the next session orients against a changed
      set of behaviors"

  - from: supervisory
    to: orient
    weight: 0.45
    cross_phase: true
    cycle_back: true
    trigger: "The weekly analytics report is ready for the supervisor to read at session start"

  # ════════════════════════════════════════════════════════
  #  OUT OF FLOW — conversation feeds the funnel
  # ════════════════════════════════════════════════════════

  - from: respond
    to: intake
    weight: 0.50
    cross_phase: true
    trigger: "A Discord conversation surfaced a link, argument, or idea worth capturing as an inbox item"
