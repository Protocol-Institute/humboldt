# Humboldt Behavior Registry
#
# Canonical inventory of all named behaviors.
#
# Classification:
#   supervised — triggered explicitly by the operator via CLI or live session
#   live       — can run autonomously during a Claude Code session
#   daemon     — runs outside live sessions (Discord bot, scheduled tasks)
#
# State:
#   stub        — defined, not yet implemented
#   prototyping — partially implemented; in active development
#   production  — running reliably; considered stable
#
# Boot behaviors are triggered deterministically by the bootstrap sequence.
# All others use behavior-### IDs with random 3-char hashes.

behaviors:

  # ── Boot sequence ──────────────────────────────────────────────────────────

  - id: boot-000
    name: Wakeup Sequence
    description: Establish situation awareness before any decisions — read notebook, scan inbox, check agenda, review law/hypothesis inventory.
    classification: supervised
    state: production
    source: BOOTSTRAP.md
    implementation: sequential file reads; LLM-free; produces orientation state for boot-001

  - id: boot-001
    name: OODA Decision Gate
    description: After orientation, decide whether to run a routine session or trigger re-orientation; then select and execute behaviors accordingly.
    classification: supervised
    state: stub
    source: methods/M-000-ooda.md
    implementation: LLM decision call with research state context; routes to other behaviors; re-orientation thresholds not yet formalized

  # ── Generative ─────────────────────────────────────────────────────────────

  - id: behavior-q2n
    name: Random Links
    description: Force structural connection between two disparate inputs to surface candidate law hypotheses.
    classification: live
    state: production
    legacy_id: M-001
    source: methods/M-001-random-links.md
    implementation: pick two corpus items by semantic distance; Sonnet prompt generates law candidates from forced analogy

  - id: behavior-f8p
    name: Canonical Domains
    description: Maintain a set of deeply understood home domains as analogy reservoirs and stress-test beds for candidate laws.
    classification: live
    state: stub
    legacy_id: M-002
    source: methods/M-002-canonical-domains.md
    implementation: domain list in canonical-domains.yaml; LLM cross-domain analogy + Pinecone corpus queries

  - id: behavior-y2g
    name: Dyson Design
    description: Push parameters to asymptotic extremes to reveal deep structural properties of a law candidate.
    classification: live
    state: stub
    legacy_id: M-011
    source: methods/M-011-dyson-design.md
    implementation: LLM prompt with explicit extreme-regime instruction; output → candidate law refinement

  - id: behavior-r4k
    name: Thought Experiments
    description: Construct imaginary scenarios to probe the limits and implications of a law or concept.
    classification: live
    state: stub
    legacy_id: M-012
    source: methods/M-012-thought-experiments.md
    implementation: LLM scenario generation + implication tracing; tests boundary conditions of law candidates

  - id: behavior-c9p
    name: Design Fictions
    description: Imagine artifacts that don't yet exist to make abstract protocol dynamics concrete and examinable.
    classification: live
    state: stub
    legacy_id: M-013
    source: methods/M-013-design-fictions.md
    implementation: LLM narrative generation around fictional artifact; output to notebook or inbox

  - id: behavior-m7v
    name: Cross-Training
    description: Engage with domains far from the primary research agenda to build unexpected analogy sources.
    classification: supervised
    state: stub
    legacy_id: M-014
    source: methods/M-014-cross-training.md
    implementation: read cross-domain source; LLM extracts structural analogies; embed into bibliography namespace

  - id: behavior-h4v
    name: Field Trip
    description: Observe protocols operating in the wild — live protocol events, real governance sessions, live coordination failures.
    classification: supervised
    state: stub
    legacy_id: M-007
    source: methods/M-007-field-trip.md
    implementation: live observation notes written to inbox; LLM synthesis into candidate observations

  - id: behavior-s5j
    name: Open Source Exploration
    description: Hunt for high-signal sources — feeds, journals, communities — to add to the research intake pipeline.
    classification: live
    state: stub
    legacy_id: M-018
    source: methods/M-018-open-source-exploration.md
    implementation: LLM gap analysis vs current feeds; score candidates (relevance/novelty/access); operator approval gate before config update

  # ── Analytical ─────────────────────────────────────────────────────────────

  - id: behavior-t5m
    name: Deep Read
    description: Fully internalize the intellectual structure of an exceptional source over multiple sessions — absorb a way of thinking, not just facts.
    classification: supervised
    state: prototyping
    legacy_id: M-003
    source: methods/M-003-deep-read.md
    implementation: read actual PDF page ranges (no training memory); Sonnet extracts candidate laws + synthesis; embed + store in humboldt namespace

  - id: behavior-j6d
    name: Bullshit Detector
    description: Rapidly assess whether incoming research or an argument deserves serious attention.
    classification: live
    state: stub
    legacy_id: M-008
    source: methods/M-008-bullshit-detector.md
    implementation: Haiku fast filter; returns confidence + red flags; gates deeper engagement

  - id: behavior-n1s
    name: Visual Thinking
    description: Use diagrams and spatial layouts to reveal structure that prose conceals.
    classification: supervised
    state: stub
    legacy_id: M-009
    source: methods/M-009-visual-thinking.md
    implementation: LLM generates ASCII/Mermaid diagrams; used within sessions to clarify candidate law structure

  - id: behavior-z8l
    name: Fermi Estimation
    description: Quick order-of-magnitude reasoning to bound claims and test their plausibility quantitatively.
    classification: live
    state: stub
    legacy_id: M-010
    source: methods/M-010-fermi-estimation.md
    implementation: LLM-assisted numerical reasoning; produces bounding estimates for law scope claims

  # ── Meta ───────────────────────────────────────────────────────────────────

  - id: behavior-w3x
    name: Reading Prioritization
    description: Decide what to read next and how deeply — matching reading investments to the current research agenda.
    classification: live
    state: stub
    legacy_id: M-004
    source: methods/M-004-reading-prioritization.md
    implementation: scan bibliography + inbox; Sonnet prioritizes by research agenda fit + phase position

  - id: behavior-k7r
    name: Explore-Exploit
    description: Decide when to open new research territory vs. deepen existing findings — manage the exploration/exploitation tradeoff.
    classification: live
    state: stub
    legacy_id: M-005
    source: methods/M-005-explore-exploit.md
    implementation: check research inventory age + diversity; LLM allocation recommendation; informs session planning

  - id: behavior-d3w
    name: Stress-Relax
    description: Deliberately shift between high-constraint synthesis and open-ended association to tune research cognition.
    classification: live
    state: stub
    legacy_id: M-015
    source: methods/M-015-stress-relax.md
    implementation: LLM meta-prompt switches cognitive mode; used when research output feels stuck or narrowing

  - id: behavior-x6b
    name: Researcher Calibration
    description: Monitor Humboldt's own development as a researcher; trigger reorientation when method/philosophy improvement opportunities are detected.
    classification: live
    state: stub
    legacy_id: M-016
    source: methods/M-016-researcher-calibration.md
    implementation: LLM self-assessment against research quality criteria; writes calibration notes to notebook

  - id: behavior-p1f
    name: Research Time Management
    description: Manage the rhythm of research attention by reading the natural arc structure of inquiry — when to dwell, move, close, or open.
    classification: live
    state: prototyping
    legacy_id: M-017
    source: methods/M-017-research-time-management.md
    implementation: arc-phase check (exploration/sensemaking/valley/heavy_lift/retrospective); LLM phase diagnosis; shapes session behavior selection

  # ── Social ─────────────────────────────────────────────────────────────────

  - id: behavior-b9c
    name: Research Conversations
    description: Have Discord conversations that advance Humboldt's research while being genuinely useful to the other party.
    classification: live
    state: prototyping
    legacy_id: M-006
    source: methods/M-006-research-conversations.md
    implementation: Discord @mention handler; Sonnet response with slim/rich context; person model lookup for history

  # ── Daemon ─────────────────────────────────────────────────────────────────

  - id: behavior-e2h
    name: Feed Intake
    description: Fetch RSS feeds on schedule; write each item to inbox as a structured file for triage.
    classification: daemon
    state: production
    source: daemon/discord_client.py (task_feeds)
    implementation: feedparser RSS fetch; write inbox/feed-*.md per item; runs every 6h via daemon scheduler

  - id: behavior-a8r
    name: Conversation Synthesis
    description: Harvest recent Discord #new-nature messages; synthesize research takeaways into a notebook section; promote inbox links to bibliography.
    classification: daemon
    state: production
    source: daemon/conversation_review.py
    implementation: Discord message harvest; Sonnet synthesis call (max 400 tokens); append to notebook; promote discord-link-*.md → bibliography/references.yaml; git commit + push; runs daily

  - id: behavior-o4t
    name: Idea and Link Capture
    description: During live Discord conversations, notice and save ideas bearing on active hypotheses and external links cited by participants.
    classification: daemon
    state: stub
    source: daemon/discord_client.py (on_message — not yet built)
    implementation: detect in on_message + task_new_nature response path; Haiku extraction call; write inbox/discord-idea-*.md and inbox/discord-link-*.md

  - id: behavior-g7u
    name: Notebook Publish
    description: Detect new notebook entries; generate a one-sentence Discord announcement; post to #new-nature with a discussion thread; push rendered HTML to PI website.
    classification: daemon
    state: production
    source: daemon/presence.py + daemon/discord_client.py (task_notebook)
    implementation: poll notebook/ for new entries; Sonnet one-liner generation; Discord post + thread; render index.yaml → humboldt-notebook.html; git push website repo

  - id: behavior-v3c
    name: Thread Farming
    description: Harvest replies from #new-nature discussion threads on notebook announcement posts; write to inbox for Conversation Synthesis to process.
    classification: daemon
    state: production
    source: daemon/thread_farmer.py
    implementation: fetch thread replies via Discord API; write inbox/discord-thread-*.md; runs daily alongside Conversation Synthesis
