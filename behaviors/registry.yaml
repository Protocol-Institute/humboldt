# Humboldt Behavior Registry
#
# Canonical inventory of all named behaviors. Rewritten 2026-09-01 (redesign Phase 3)
# against the pruned keep-list in plans/redesign-2026-08.md §6.1: the eight funnel
# stages (§5) plus orient / respond / graph-evolve / supervisory. The previous
# 26-behavior registry — boot-000/001 and ~14 never-implemented stubs (Backpocket
# Viewing, Curiosity Browsing, Field Trip, Bullshit Detector, Cross-Training, Dyson
# Design, Design Fictions, …) — is deleted, not carried as dead weight. Good ideas
# among them re-enter as behavior requests through the definition pipeline
# (§6.3, behaviors/definition-rubric.md), which is what the approval queue is for.
#
# Entry schema (§6.2) — every entry must be complete enough to run, or to hand to a
# definition session:
#
#   id           stable slug; matches the behavior_id written to behaviors/log.jsonl
#   name         human label
#   phase        Double Freytag phase this behavior serves (see mdp.yaml `phases`)
#   status       active | proposed | retired
#                  active   — built and running
#                  proposed — specified here, not yet implemented; entrypoint is the
#                             intended path, not an existing file
#                  retired  — kept for log provenance; never scheduled
#   defined_by   claude-sonnet | claude-opus | supervisor
#   trigger      plain-language firing condition, supervisor-editable
#   action.entrypoint  module:function that runs it
#   action.model       runtime model tier, or null for code-only behaviors
#   action.prompt      prompt file, or null when the prompt is inline in the module
#   produces     event vocabulary this behavior appends to the log / events spine
#   utilization  `auto` — filled by analytics (Phase 4) from behaviors/log.jsonl
#
# NOTE ON action.model: nothing reads this field yet. The live values are the module
# constants (INDUCT_MODEL, _TRIAGE_MODEL, ASSESS_MODEL_ROUTINE/HARD, …) and this
# registry records what those constants actually say today — deliberately NOT the
# aspirational ids in the §6.2 spec example, so the registry does not quietly disagree
# with what runs. When the console starts reading this field (Phase 3/4), the module
# constants become the fallback, and any drift surfaces then rather than silently.

behaviors:

  # ── Funnel stage 1–4: intake and reading ───────────────────────────────────

  - id: intake
    name: Intake
    phase: exploration
    status: active
    defined_by: supervisor
    trigger: "Continuous — RSS feeds polled every 6h; Discord capture on #new-nature activity; thread
      replies harvested daily; operator drops any time"
    action:
      entrypoint: daemon/discord_client.py:task_feeds
      model:
      prompt:
    produces: [inbox-item]
    utilization: auto
    notes: >
      Three companion paths write the same inbox/ surface and are part of this stage:
      daemon/capture.py (Discord idea/link capture), daemon/thread_farmer.py (notebook
      announcement thread replies), and manual operator drops. Code-only — no LLM call
      on the ingest path itself.

  - id: triage
    name: Triage
    phase: exploration
    status: active
    defined_by: supervisor
    trigger: "Daily; or on session request when inbox depth exceeds ~200 items"
    action:
      entrypoint: agent/triage.py:triage_feed
      model: claude-haiku-4-5-20251001
      prompt:
    produces: [bib-entry, triage-report]
    utilization: auto
    notes: >
      Scores inbox items in batches of 15 against the law inventory and seed pool
      (agent/funnel_context.py). Every non-discard item is tagged content|meta and gets
      a bib-NNNN entry at read_depth: listed. triage_discord is the same behavior over
      inbox/discord-*.md with a higher discard bar.

  - id: shallow-read
    name: Shallow Read
    phase: exploration
    status: active
    defined_by: supervisor
    trigger: "Daily, consuming the most recent triage report's non-discard items"
    action:
      entrypoint: agent/shallow_read.py:shallow_read
      model: claude-haiku-4-5-20251001
      prompt:
    produces: [shallow-note, bib-entry, seed, graph-proposal]
    utilization: auto
    notes: >
      Writes bibliography/shallow-reads/YYYY-MM-DD-{slug}.md, upgrades the bib entry to
      read_depth: shallow, emits a seed into laws/seeds/ when the note is law-shaped, and
      decides store-only vs escalate-to-deep. Per §5, `meta`-tagged items terminate in a
      graph-change proposal instead of a seed — that path is not built yet (see
      graph-evolve, status: proposed).

  - id: deep-read
    name: Deep Read
    phase: exploration
    status: active
    defined_by: supervisor
    trigger: "Session-gated by design (quality over throughput); or batch-deepread on operator/remote
      trigger to clear the escalated queue"
    action:
      entrypoint: agent/humboldt.py:cmd_deepread
      model: claude-opus-4-8
      prompt:
    produces: [deep-note, bib-entry, seed, graph-proposal]
    utilization: auto
    notes: >
      Must read the actual PDF in bibliography/deep-reads/, never training memory — the
      standing M-003 rule. The one intentionally session-gated funnel stage (§5); the
      batch path exists for queue-clearing and can run server-side after cutover.

  # ── Funnel stage 5–6: the epistemic core ───────────────────────────────────

  - id: induct
    name: Law Induction Sweep
    phase: sensemaking
    status: active
    defined_by: supervisor
    trigger: "Weekly; or >=10 unconsumed seeds; or on session request"
    action:
      entrypoint: agent/induct.py:induct
      model: claude-sonnet-4-6
      prompt: prompts/induct.md
    produces: [law-created, evidence, counterexample]
    utilization: auto
    notes: >
      Freeze-immune — composes from seeds, reads-since-cursor and the law inventory, and
      performs no corpus retrieval, so it runs during a read outage. Drafting nothing is a
      valid sweep outcome.

  - id: assess
    name: Law Assessment
    phase: valley
    status: active
    defined_by: supervisor
    trigger: "Weekly per active law; or on session request; or when a law accumulates >=3 new evidence
      attachments since its last assessment"
    action:
      entrypoint: agent/assess.py:assess
      model: claude-sonnet-4-6
      prompt: prompts/assess.md
    produces: [promoted, demoted, assessed-hold, counterexample]
    utilization: auto
    notes: >
      Two-tier: ASSESS_MODEL_ROUTINE (sonnet) for exploration/sensemaking/valley laws,
      ASSESS_MODEL_HARD (claude-opus-4-8) for heavy-lift and retrospective. Refuses to run
      while the corpus-read breaker is tripped unless --no-corpus is passed — an
      evidence test on an empty evidence slot is worse than no test.

  # ── Funnel stage 7–8: output and monitoring ────────────────────────────────

  - id: publish
    name: Publish
    phase: heavy_lift
    status: active
    defined_by: supervisor
    trigger: "On law event (creation, promotion, demotion, falsification); batched to one site deploy
      per sweep, Discord announcements capped at 2/day"
    action:
      entrypoint: agent/law_notify.py:flush
      model:
      prompt:
    produces: [site-deploy, discord-post]
    utilization: auto
    notes: >
      Pause-gated, and gated on publish_site.is_production_deploy() — refuses to announce
      a law event when the deploy would land on a Preview URL rather than the public site.
      Sits in heavy_lift because publication is the delivery mechanism of the separation
      event, which is what the heavy-lift -> retrospective transition requires.

  - id: monitor
    name: Falsification Monitor
    phase: retrospective
    status: proposed
    defined_by: supervisor
    trigger: "Weekly, over retrospective-stage laws only — new corpus material since the law's last monitor
      pass"
    action:
      entrypoint: agent/monitor.py:monitor
      model: claude-haiku-4-5-20251001
      prompt: prompts/monitor.md
    produces: [challenged, challenge-flag]
    utilization: auto
    notes: >
      NOT BUILT — no agent/monitor.py, no prompts/monitor.md. Its input set is also
      currently empty: no law has reached retrospective stage (nothing has had a
      separation event), so this behavior has had nothing to do. Haiku screens for
      candidate challenges, escalating to Sonnet to draft the actual challenge; flags
      cycle back through `assess`. Build when the first law reaches retrospective.

  # ── Non-funnel: orientation, conversation, and the meta loop ───────────────

  - id: orient
    name: Orientation
    phase: liminal
    status: proposed
    defined_by: supervisor
    trigger: "Start of every session; and on daemon startup after an outage longer than a few hours"
    action:
      entrypoint: agent/orient.py:orient
      model: claude-sonnet-4-6
      prompt: prompts/orient.md
    produces: [orientation-state]
    utilization: auto
    notes: >
      NOT BUILT as code. Replaces boot-000 (Wakeup Sequence) and boot-001 (OODA Decision
      Gate) from the retired registry: boot-000's file-reading ritual currently lives in
      CLAUDE.md's Session Rituals and runs by hand each session; boot-001's decision gate
      was never implemented. Reads state (laws, queues, agenda, pre-notebook) and picks
      the session's focus. Until built, the CLAUDE.md ritual is the live implementation.

  - id: respond
    name: Discord Response
    phase: any
    status: active
    defined_by: supervisor
    trigger: "On @mention in Discord, relevance-gated — Humboldt answers when it has something corpus-grounded
      to add, not whenever addressed"
    action:
      entrypoint: daemon/presence.py:generate_mention_response
      model: claude-sonnet-4-6
      prompt:
    produces: [discord-post]
    utilization: auto
    notes: >
      Out of the phase flow (phase: any) — a conversation can happen at any arc position.
      Discloses the outage when the corpus-read breaker is tripped rather than answering
      ungrounded. The §9 relevance-gate rework is Phase 5 work; proactive self-initiated
      posting stays disabled (_PROACTIVE_ENGAGEMENT_ENABLED = False) until then.

  - id: graph-evolve
    name: Graph Evolution
    phase: retrospective
    status: proposed
    defined_by: supervisor
    trigger: "On a meta read producing a graph-change proposal; or on an analytics prune/split flag"
    action:
      entrypoint: agent/graph_evolve.py:propose
      model: claude-sonnet-4-6
      prompt: prompts/graph-evolve.md
    produces: [graph-proposal, queue-entry]
    utilization: auto
    notes: >
      NOT BUILT. The mechanism by which meta reads change how Humboldt works (§6.4):
      classifies each request SIMPLE/HARD per behaviors/definition-rubric.md, drafts the
      full registry entry for SIMPLE ones, writes a structured brief for HARD ones, and
      files either into behaviors/queue.yaml. Nothing it drafts runs before supervisor
      approval in the console.

  - id: supervisory
    name: Supervisory Sweep
    phase: retrospective
    status: active
    defined_by: supervisor
    trigger: "Weekly"
    action:
      entrypoint: agent/behaviors.py:cmd_supervisory
      model:
      prompt:
    produces: [analytics-report, queue-entry]
    utilization: auto
    notes: >
      Currently a CLI-only transition-weight analysis over behaviors/log.jsonl. Phase 4
      widens it to the full §8 sweep — utilization, queue depths, prune/split flags, KPI
      report to analytics/weekly-YYYY-MM-DD.yaml — and surfaces it in the console.
