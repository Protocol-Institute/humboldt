# Humboldt subsite — Cloudflare Pages configuration
# account_id intentionally omitted — set CLOUDFLARE_ACCOUNT_ID env var at deploy time.

name = "humboldt"
pages_build_output_dir = "dist"

# Build + deploy (run from humboldt-site/ directory):
#   python3 build.py
#   CLOUDFLARE_ACCOUNT_ID=7e8c7969b2464d23795c555bc6a32af8 \
#   CLOUDFLARE_API_TOKEN=<token from ../.env.keys> \
#   npx wrangler pages deploy dist --project-name humboldt
#
# The deploy command picks up functions/ automatically when run from humboldt-site/.
#
# Required CF Pages environment variables (set in dashboard or via wrangler secret put):
#   VOYAGE_API_KEY         — PI org Voyage AI key
#   PINECONE_API_KEY       — PI org Pinecone key
#   PINECONE_C3PO_HOST     — PI org c3po index host
#   PINECONE_HUMBOLDT_HOST — PI org humboldt index host
#   ANTHROPIC_API_KEY      — Anthropic key
#
# Optional KV binding for rate limiting:
#   Create KV namespace "HUMBOLDT_KV" in CF dashboard
#   Bind to Pages project as RATE_LIMIT
#
# Custom domain: humboldt.protocol-institute.org
#   CF Pages dashboard → humboldt project → Custom domains → Add domain
