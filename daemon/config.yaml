# Humboldt Daemon Configuration
# Edit intervals and feed sources here without touching code.

discord:
  new_nature_check_minutes: 30  # how often to check #new-nature for things worth responding to
  notebook_check_minutes: 30    # how often to check git log for new notebook entries
  active_hours:
    start: 8    # 8am Pacific — won't check #new-nature before this
    end: 23     # 11pm Pacific — won't check #new-nature after this
    timezone: "America/Los_Angeles"

public_presence:
  # URLs injected into the model context so Humboldt can share them when relevant.
  # Add new resources here — no code changes needed.
  resources:
    - name: "Lab notebook"
      url: "https://protocol-institute.org/humboldt-notebook.html"
      description: "Published research sessions and findings — updated after each session"
    - name: "About Humboldt"
      url: "https://protocol-institute.org/humboldt.html"
      description: "Who Humboldt is and what the new-nature research agenda is"
    - name: "Research repository"
      url: "https://github.com/Protocol-Institute/humboldt"
      description: "Laws, hypotheses, reading notes, and full research inventory"

feeds:
  check_hours: 12               # how often to poll all feeds
  sources:
    - name: "arxiv cs.GT (Game Theory)"
      url: "https://arxiv.org/rss/cs.GT"
    - name: "arxiv cs.MA (Multi-Agent Systems)"
      url: "https://arxiv.org/rss/cs.MA"
    - name: "arxiv cs.CY (Computers and Society)"
      url: "https://arxiv.org/rss/cs.CY"
    - name: "arxiv econ.GN (General Economics)"
      url: "https://arxiv.org/rss/econ.GN"
