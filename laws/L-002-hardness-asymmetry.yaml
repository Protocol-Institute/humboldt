id: "L-002"
title: "Hardness Asymmetry"
slug: "hardness-asymmetry"
stage: heavy-lift
status: active
origin: discovered
source: null
confidence: supported

statement: >
  In any protocol with a verification function and an execution or forgery function,
  the verification cost and the circumvention cost are structurally decoupled and can
  differ by arbitrary orders of magnitude. Protocol robustness is determined by this
  ratio, not by the absolute cost of either function alone.

mechanism: >
  Verification and circumvention exploit different mathematical or social structures —
  they are not inverses. Public-key cryptography exploits trapdoor one-way functions.
  Social reputation exploits the asymmetry between social memory (cheap, distributed)
  and behavior change (costly, personal). The asymmetry is a design resource: protocols
  can be engineered to maximize the circumvention/verification ratio.

justification: >
  Builds on the pre-Humboldt c3po observation that "hardness matters"; the genuine
  contribution (DS-002) is the ratio reframing — hardness is not an absolute property
  but the verification/circumvention ratio, and the ratio can be engineered. The
  reframing makes previously anomalous cases legible: litigation harassment is
  "inverted hardness" (circumvention cheaper than verification — a designed failure
  mode), and proof-of-work is deliberately soft (the energy cost is the feature).
  The biological immune system maps cleanly — natural selection engineered a high
  hardness ratio — which suggests the pattern is structural rather than an artifact
  of human protocol design.

examples:
  - domain: "cryptographic"
    description: "Public-key infrastructure: verification cheap; forgery computationally infeasible
      under current assumptions — arbitrary ratio via trapdoor one-way functions."
    source: "Cryptographic literature (PKI, trapdoor functions)"
  - domain: "social"
    description: "Reputation systems: earning reputation requires sustained behavior; verifying
      it is cheap; destroying it requires inaction or one incident."
    source: "Social reputation system research"
  - domain: "financial"
    description: "Fraud detection: transaction verification cheap; constructing undetected fraud
      costly."
    source: "Financial fraud detection literature"
  - domain: "legal (inverted case)"
    description: "Tort law harassment campaigns: filing cheap, defending expensive — a negative
      hardness ratio, i.e., a designed failure mode the law predicts."
    source: "Litigation cost asymmetry literature"
  - domain: "biological (analogy)"
    description: "Immune recognition: self/non-self discrimination cheap; immune evasion costly
      for pathogens — a naturally selected high ratio."
    source: null

counterexamples:
  - description: "Simple passwords: circumvention and verification costs converge."
    resolution: "Design failure (weak hardness), not a counterexample — the law claims the asymmetry
      is achievable and significant, not universal."
    source: null
  - description: "Proof-of-work systems make verification and circumvention expensive at similar
      rates."
    resolution: "Deliberately soft by design; the energy cost is the feature (resource commitment).
      The law is about achievability of asymmetry, not its universality."
    source: null

open_questions:
  - "Is there a general design procedure for maximizing the circumvention/verification ratio
    outside cryptography? The social case has no rigorous theory."
  - "Inverted-hardness protocols (harassment-cheap systems: litigation, spam) as a distinct
    category — worth a separate arc?"

falsification: >
  A protocol where circumvention cost and verification cost converge and the protocol
  nonetheless remains robust. (Convergence with fragility — passwords — confirms
  rather than refutes.)

references:
  - "Cryptographic literature: PKI, trapdoor functions"
  - "Litigation cost asymmetry / tort law design literature"
  - "Social reputation system research"
seeds: []
related:
  - "L-001"  # both concern structural cost asymmetries in protocol dynamics

triggers:
  advance: >
    Separation artifact complete: publishable writeup drafted and reviewed. Optional
    strengthener: a first-pass design procedure for engineering hardness ratios in
    non-cryptographic (social/institutional) protocols.
  challenge: >
    A robust protocol with demonstrably converged verification and circumvention
    costs — survives one assessment pass.

