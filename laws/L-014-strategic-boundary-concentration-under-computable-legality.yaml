triggers:
  advance: >
    Empirical evidence (not simulation) from two or more independent regulatory domains showing
    measurable boundary concentration shifts following a rules-as-code or computability reform,
    with pre/post distributions documented and the conduct/signal estimand distinction addressed.
  challenge: >
    A documented case where rendering rules computable caused agents to distribute more uniformly
    across the compliance interior, or where an equivalently computable rule produced no boundary
    concentration, with a credible account of the suppressing mechanism.
