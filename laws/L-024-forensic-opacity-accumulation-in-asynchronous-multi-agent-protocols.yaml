triggers:
  advance: >
    Empirical demonstration in 2+ independent multi-agent deployment contexts that failure attribution
    time (or attribution confidence) degrades measurably as a function of pipeline depth and
    branching factor, with the degradation curve fitting a super-linear function, and with complete
    logs available.
  challenge: >
    A documented multi-agent failure investigation where attribution was achieved efficiently
    at depth >5 using only standard audit logs, without re-running the pipeline or accessing
    agent internal states—demonstrating that log completeness can substitute for causal reversibility.
