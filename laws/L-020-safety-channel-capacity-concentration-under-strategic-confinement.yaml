triggers:
  advance: >
    Mechanism confirmed with empirical or formal demonstration in 2+ independent security domains
    showing that shared coordination resources enable equilibrium selection despite near-zero
    channel capacity, with the boundary condition on 'shared coordination resources' operationally
    specified.
  challenge: >
    A formal proof that shared training distributions or common knowledge do not constitute
    coordination resources sufficient for Schelling-point selection under near-zero channel
    capacity, demonstrating that the classical confinement guarantees remain valid for current
    ML systems.
