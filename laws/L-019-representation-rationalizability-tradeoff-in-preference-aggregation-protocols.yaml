    and multi-stakeholder governance and ranked-choice voting implementations) with the cycle-geometry
    lower bound measured empirically and shown to constrain achievable performance independent
    of model capacity.
  challenge: >
    A documented case where joint embedding-reward training on a high-cycle dataset achieves
    near-zero excess loss without embedding coarsening, demonstrating that the tradeoff can
    be resolved through training procedure rather than being structurally imposed.
