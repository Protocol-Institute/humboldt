falsification: >
  A preference aggregation protocol that achieves zero excess loss on a dataset with documented
  Condorcet cycles, without coarsening the embedding to the point of losing preference distinctions
  — demonstrating that the lower bound can be escaped through architecture rather than being
  dataset-geometry-determined.
