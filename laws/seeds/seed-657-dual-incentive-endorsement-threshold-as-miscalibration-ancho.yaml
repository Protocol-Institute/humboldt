title: Dual-Incentive Endorsement Threshold as Miscalibration Anchor
text: In any protocol where an agent's report triggers both a scoring-rule reward (function of accuracy)
  and a decision-consequence reward (function of approval/rejection), the welfare-maximizing decision
  rule is necessarily nonaffine, creating a "reserve report" equilibrium at which the agent's cost of
  strategic deviation exactly equals the decision payoff. This threshold exists independently of agent
  rationality or optimization intensity — it is a structural property of the incentive layering. The miscalibration
  is not preventable via better calibration training; it is endogenous to the protocol's dual-layer structure.
