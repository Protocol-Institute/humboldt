id: seed-594
title: Legibility Tax Under Credit Orthogonalization
text: When credit assignment protocols become more legible through explicit factorization (e.g., separating
  agent contribution from exogenous population dynamics), do agents receiving clearer signals exhibit
  increased strategic behavior in response — such as coalitional defection, timing-sensitive exit, or
  contribution withholding — that recovers or exceeds the original noise cost? In open-team systems, does
  better credit isolation create new coordination problems at the boundary between agent choice and team
  membership?
