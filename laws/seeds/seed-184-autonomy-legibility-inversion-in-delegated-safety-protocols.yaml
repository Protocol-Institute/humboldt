title: Autonomy Legibility Inversion in Delegated Safety Protocols
text: 'In safety-critical protocols designed for users with cognitive or physical limitations, the system''s
  legibility (transparency of recommendations and reasoning) and the user''s legibility (observability
  of their preferences and decision capacity) are in tension: increasing system transparency to improve
  user trust may increase system authority and decrease user involvement in risk judgment, particularly
  when the protocol''s predictions are formalized as actionable recommendations. This inversion may be
  invisible to the system designer if success is measured only in reduced adverse events rather than in
  user agency preservation.'
