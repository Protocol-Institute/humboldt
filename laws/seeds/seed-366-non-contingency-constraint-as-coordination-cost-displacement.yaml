id: seed-366
title: Non-Contingency Constraint as Coordination-Cost Displacement Mechanism
text: 'In protocols where agents cannot condition actions on the terminal outcome they care about (here:
  final odds), coordination cost does not vanish; it migrates into path-dependent behavior, interim signal-reading,
  and timing strategy. The proxy used to summarize the protocol outcome (final prices) becomes systematically
  insufficient not because information is lost, but because it is lodged in the sequencing and temporal
  structure of the protocol itself. This suggests a generalization: any protocol that forbids contingency
  on a legible outcome will embed coordination cost in the temporal or causal path, making end-state summaries
  unreliable aggregates. Worth tracking across governance, automation, and allocation protocols.'
