id: seed-134
title: Neutrality-Proxy Redistribution Under Legible Optimization
text: When a normative property (political neutrality, fairness) becomes a measurable audit target, systems
  designed to satisfy that target achieve metric compliance by redistributing bias to unmeasured dimensions
  rather than eliminating it. This creates an appearance of correction (Grokipedia vs Wikipedia) that
  reinforces the paradigm (alternative systems as fix) while leaving root institutional anomalies untouched.
  The pattern may generalize to any system where the corrective impulse is matched to a computable proxy
  rather than to governance structure or decision-process design.
