id: seed-616
title: Belief Compression Under Fixed Token Budget as Strategic Leakage Channel
text: When theory-of-mind reasoning is compressed into a fixed-size continuous latent representation shared
  across agents, the compression inevitably loses distributional information about partner uncertainty.
  Under competitive or partially-adversarial conditions, agents can exploit the gap between the compressed
  token representation and the original partner belief distribution to extract advantage or coordinate
  implicitly. The fixed budget constraint makes the leakage systematic and exploitable rather than noisy.
  This may generalize to any protocol that compresses heterogeneous private beliefs into shared legible
  tensors for efficiency.
