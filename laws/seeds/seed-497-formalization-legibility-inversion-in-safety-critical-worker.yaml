id: seed-497
title: Formalization-Legibility Inversion in Safety-Critical Worker Protocols
text: In safety-critical protocol systems where worker judgment is both essential and operationally illegible
  (election work, medical triage, air traffic control), formalization driven by external auditing pressure
  does not reduce worker burden or protocol error — it displaces error into the gap between what the formal
  system claims to do and what workers must actually do to keep it functional. The formal system becomes
  more legible to regulators and auditors, but *less* legible to workers, because the formalization does
  not encode the conditions under which the rule applies. This creates a regime where protocol violations
  accumulate in the informal layer, and failures in the informal layer appear in the formal audit as protocol
  failures, not as evidence of formalization inadequacy.
