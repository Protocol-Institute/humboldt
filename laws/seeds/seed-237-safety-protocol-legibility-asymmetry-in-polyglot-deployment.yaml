title: Safety Protocol Legibility Asymmetry in Polyglot Deployment
text: 'In conversational AI systems deployed across multiple languages, safety intervention protocols
  show measurable variance correlated with language resource abundance, suggesting that the boundary between
  harmful and benign requests becomes legible to the fine-tuning and evaluation process only in high-resource
  language contexts. Where the protocol boundary is underspecified (low-resource or underrepresented language
  contexts), the safety intervention fails not because the mechanism is absent but because the decision
  boundary was never rendered legible to optimization. This implies that protocol safety in polyglot systems
  is not a property of the system architecture but of the legibility landscape during training—a form
  of upstream asymmetry that cannot be corrected by post-hoc intervention without re-tuning. The generalization:
  *safety protocols ossify around the legibility contours of their training data, not around the actual
  task.*'
