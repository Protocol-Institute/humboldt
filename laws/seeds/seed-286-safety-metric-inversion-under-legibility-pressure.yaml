title: Safety Metric Inversion Under Legibility Pressure
text: In safety-critical protocols where the unmeasurable goal (preventing real-world harm to vulnerable
  populations) is displaced by a measurable proxy (formal refusal behavior), the system optimizes for
  legible compliance signals rather than outcome protection. The shift occurs not because the proxy is
  wrong, but because it is precisely computable and subject to directed optimization, while the underlying
  harm remains distributed, context-dependent, and difficult to audit. This pattern should generalize
  to any safety protocol where the evaluation surface is more legible than the outcome surface.
