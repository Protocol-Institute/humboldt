title: Boundary Dynamics Nonequivalence in Protocol Regime Shifts
text: 'In formal protocol systems, state-space evolution under fixed governance and
  authority boundaries (dynamics) produces different failure signatures and recovery
  properties than changes to those boundaries themselves (topology). When boundary
  definition is redrawn — through attrition, delegation, or formal scope redefinition
  — systems can exhibit continuity of internal structure alongside discontinuity of
  observed function. The question: under what conditions does boundary change *require*
  regime-shift framing, and can internal dynamics alone trigger the redefinition of
  boundaries that would then justify regime-shift language? This may separate failures
  of institutional memory (L-015 dynamics mode) from failures of institutional identity
  (boundary mode).'
