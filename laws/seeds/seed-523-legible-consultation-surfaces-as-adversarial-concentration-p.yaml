id: seed-523
title: Legible Consultation Surfaces as Adversarial Concentration Points
text: 'When safety-critical classification protocols are decomposed into legible multi-agent consultation
  loops, the optimization pressure exerted by adversarial agents concentrates at the documented disagreement/agreement
  surfaces rather than distributed across the content being classified. The system makes visible (and
  thus targetable) the decision boundaries between agents. Strategic submitters can learn to craft documents
  that create maximal inter-agent disagreement or systematic agent-pairing patterns, turning the consultation
  protocol itself into a legible attack surface. This generalizes: any protocol that makes its internal
  disagreement surfaces legible and documented will attract optimization pressure to those surfaces before
  content-level optimization.'
