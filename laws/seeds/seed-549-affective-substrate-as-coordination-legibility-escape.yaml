id: seed-549
title: Affective Substrate as Coordination Legibility Escape
text: 'When protocol coordination signals are encoded in affective metadata (tone, prosody, emotional
  framing) rather than semantic content, do agents treat the two channels as *substitutable* for the same
  coordination task, or do affective signals enable coordination patterns that semantic signals cannot?
  If the former, affective metadata is substrate polymorphism; if the latter, it represents a distinct
  legibility channel that may be immune to certain forms of optimization capture that target semantic
  proxies. This opens the question: *is there a legibility hierarchy in which affective signals are more
  resistant to formal capture than semantic ones, or less?*'
