id: seed-544
title: Metalinguistic Displacement Under Formalization Pressure
text: When formalization pressure operates at the lexical layer (targeting naming
  conventions, terminology adoption, and semantic standardization), does constraint
  on a primary term (e.g., 'protocol') block downstream ossification, or displace
  optimization pressure to synonym spaces and unmonitored descriptive practices? Under
  what conditions does naming-layer opacity preserve functional informality, and under
  what conditions does it merely hide formalization ratchet operation from institutional
  oversight?
