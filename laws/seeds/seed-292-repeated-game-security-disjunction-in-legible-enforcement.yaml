id: seed-292
title: Repeated-Game Security Disjunction in Legible Enforcement
text: In protocols where enforcement signals (slashing, penalties, proof requirements) are rendered computable
  and legible, one-shot rationality conditions are necessary but not sufficient for security under repeated
  play with the same stake. The gap between single-interaction and multi-interaction payoff structures
  creates an exploitation surface invisible to stateless verification models. This generalizes beyond
  restaking to any protocol where agents repeatedly interact under a fixed enforcement rule that was validated
  only for one-shot play; the legibility that enables automated punishment also enables time-stratified
  arbitrage of the penalty function.
