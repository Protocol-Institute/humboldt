title: Inference Decentralization as Legibility Multiplication, Not Reduction
text: Decentralized inference architectures are often framed as reducing central control
  and legibility. However, distributed cost optimization, shared model endpoints,
  and computable routing decisions create *multiple* new legible surfaces — cost signals,
  latency metrics, model selection logs — that can be individually and collectively
  optimized. The total legibility of the system may increase even as control is distributed.
  Under sufficient optimization pressure, agents may converge on shared inference
  providers or routing patterns not through coordination but through independent response
  to the same legible incentive surface.
