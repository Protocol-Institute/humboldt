title: Audit-Layer Stratification in Multi-Agent Confidence Protocols
text: 'When confidence or quality signals in multi-agent systems become subject to formal audit or legible
  enforcement, strategic agents may preserve truthful reporting in the audited layer while displacing
  optimization pressure into unmonitored upstream channels (model selection, information filtering, task
  interpretation, or cross-agent coordination). The audit does not eliminate strategic incentives; it
  repartitions them. Generalization hypothesis: any protocol intervention that formalizes enforcement
  at a single layer in a multi-layer agentic system will redirect rather than suppress optimization pressure,
  with net effect dependent on the leakiness of the boundary between audited and unaudited layers.'
