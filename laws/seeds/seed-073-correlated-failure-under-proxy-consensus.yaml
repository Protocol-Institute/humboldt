id: seed-073
title: Correlated Failure Under Proxy Consensus
text: When a protocol signal (consensus, agreement, averaged output) becomes the legible optimization
  target, and the underlying agents share a common training substrate or loss function, independent failure
  modes collapse into correlated failure modes. Jury size ceases to provide robustness; instead, adding
  more judges of the same type concentrates optimization pressure on the shared signal. This generalizes
  beyond LLM evaluation to any multi-agent protocol where agents optimize a shared, measurable proxy and
  share training or incentive lineage.
