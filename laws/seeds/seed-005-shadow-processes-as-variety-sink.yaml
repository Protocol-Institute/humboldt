id: seed-005
title: Shadow processes as variety sink
text: 'Protocols compress variety by design but cannot eliminate it — only redirect it. The

  residual surfaces as workarounds, informal channels, exception-handling routines, and

  documented noncompliance: a shadow infrastructure that grows in proportion to the gap

  between what the protocol demands and what the situation requires. High-friction protocols

  should be detectable by their shadow activity.'
