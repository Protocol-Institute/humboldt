title: Conservative potential fields in protocol evolution
text: 'If conserved quantities constrain the evolutionary trajectory of protocol systems —

  analogous to symmetries generating conservation laws in physics — then protocol adaptations

  would not be random but channeled through an energy landscape shaped by these invariants.

  What plays the role of "symmetry" in artificial systems? Invariants in protocol state

  spaces, architectural regularities, information topology? No concrete candidate yet.'
