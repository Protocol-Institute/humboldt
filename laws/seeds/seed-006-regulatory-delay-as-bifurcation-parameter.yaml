id: seed-006
title: Regulatory delay as bifurcation parameter
text: 'In adaptive multi-agent systems, stability is not monotonic in regulatory response speed:

  below a critical observation-to-intervention delay threshold the system equilibrates, above

  it instability emerges independent of shock magnitude. Regulatory latency acts as a

  bifurcation parameter, not merely a friction cost. Protocol timing constraints may be as

  fundamental to stability as incentive alignment.'
