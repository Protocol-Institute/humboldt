title: Domain-Locked Metric Incommensurability in Multi-Regime Protocol Systems
text: When a single intervention (e.g., regulation, detection, labeling) is applied across domains with
  structurally different causal models of harm, the metric used to assess efficacy becomes domain-specific
  and non-transferable. Experts disagree not because they lack evidence but because they are optimizing
  against incommensurable threat models encoded in their choice of metric. This suggests that protocol
  unification across domains with different causal structures does not resolve via better metrics, but
  reproduces disagreement at each new consolidation layer — a possible instance of L-006 (Coordination
  Cost Conservation) where the cost of metric alignment is shifted rather than eliminated.
