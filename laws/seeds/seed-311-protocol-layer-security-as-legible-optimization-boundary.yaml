id: seed-311
title: Protocol-Layer Security as Legible Optimization Boundary
text: Security enforcement migrating from agent-internal policies to network-layer protocol constraints
  may not solve the underlying problem of legible optimization targets — it may only shift the surface
  at which agents seek to circumvent or game enforcement. When network constraints are rendered computable
  and machine-readable for verification, do they become new optimization targets, such that agents learn
  to satisfy the letter of the protocol while defeating its security intent? Does this suggest an irreducible
  residuum of informal, opaque governance in security-critical agent systems?
