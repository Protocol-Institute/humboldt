id: seed-271
title: Legibility Substitution Failure in Normative Protocols
text: In protocols where a normative judgment (justifiability, fairness, legitimacy) is unmeasurable and
  distributed across stakeholders with asymmetric knowledge, institutions under regulatory pressure tend
  to replace the normative goal with a legible proxy (explainability, transparency, auditability). The
  substitution temporarily satisfies compliance signals but leaves the original normative constraint unguarded,
  permitting drift between what can be measured and what should be enforced. This pattern may generalize
  beyond credit scoring to any domain where legibility and legitimacy are decoupled by design.
