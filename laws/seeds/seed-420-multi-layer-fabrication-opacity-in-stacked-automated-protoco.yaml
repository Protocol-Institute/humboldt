title: Multi-Layer Fabrication Opacity in Stacked Automated Protocols
text: In multi-stage automated pipelines where each stage consumes outputs from prior stages, fabrication
  introduced at early layers becomes progressively harder to detect at verification points downstream
  because verification operates only on final outputs, not intermediate representations. The detection
  cost (and therefore the incentive to fabricate) is concentrated at the earliest and least-observed stages.
  This suggests a general vulnerability in stacked protocol systems where legibility decreases monotonically
  moving backward through the pipeline. Guardrails applied at single stages cannot address this; the architecture
  itself is the problem.
