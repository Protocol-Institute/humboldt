title: Audit Trail Legibility as Perverse Synchronization Force in Safety-Critical Governance
text: In safety-critical protocols (criminal justice, medical licensing, environmental enforcement) where
  agent behavior is audited via legible records (case outcomes, sentencing length, approval rates), agents
  may synchronize on externally-driven signals (electoral cycles, media attention, regulatory fashion)
  rather than protocol-internal goals, precisely *because* the audit trail makes deviation visible. Legibility
  intended to enforce consistency instead creates a coordination surface for collineation with salient
  external incentives. The protocol tolerates this because the anomaly is distributed (all prosecutors
  shift together) and rationalized post-hoc as within-protocol variance.
