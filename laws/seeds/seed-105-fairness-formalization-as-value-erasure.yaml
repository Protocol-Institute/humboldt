id: seed-105
title: Fairness Formalization as Value Erasure
text: When an unmeasurable allocation norm (e.g., "creator should be fairly compensated for their contribution
  to LLM training and retrieval") is rendered as a computable proxy (e.g., Shapley value), the formalization
  succeeds at producing a number but fails to recover the original coordination function. The computed
  metric becomes the new optimization target, and optimizing agents will exploit the gap between the proxy
  and the underlying goal. The cost of solving the technical attribution problem is that the social protocol
  for recognizing and valuing creation is displaced by a legible but gameable formula.
