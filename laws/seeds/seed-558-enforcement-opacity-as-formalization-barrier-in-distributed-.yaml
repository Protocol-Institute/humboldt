id: seed-558
title: Enforcement Opacity as Formalization Barrier in Distributed Coordination
text: Formal protocols do not propagate into lived practice when verification and
  enforcement require distributed or constant surveillance of agent behavior. In multi-agent
  systems where rule violations are cheap to conceal and costly to detect (high detection
  cost relative to potential gain from violation), informal norms — which rely on
  reputation and social reinforcement — may remain stable *despite* availability of
  formal alternatives. Formalization ratchet thus depends not only on stress or scaling
  pressure, but on the legibility and cost-efficiency of enforcement infrastructure
  relative to community size.
