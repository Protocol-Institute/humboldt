title: Latency Asymmetry as Irreducible Proxy Generator in Safety-Critical Protocols
text: In safety-critical protocols where verification must complete under hard latency bounds but attack
  preparation has no matching constraint, systems necessarily shift to proxy signals (aggregate patterns,
  historical models, consensus checks) to approximate verification within the time window. These proxies
  become stable optimization targets for adversaries operating without the latency constraint. The asymmetry
  is not solvable by moving the verification check upstream or downstream—it is architecturally baked
  into the safety-criticality itself. This may generalize to any protocol where the protected action (braking,
  shutdown, resource allocation) is faster-acting than the verification check intended to guard it.
