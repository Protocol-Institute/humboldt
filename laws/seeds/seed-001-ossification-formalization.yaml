id: seed-001
title: Ossification ≠ formalization
text: 'Street food markets can be highly formalized (licensing, fees, operating hours) yet remain

  behaviorally adaptive — which suggests ossification and formalization are not coupled

  phenomena but independent variables with different causal drivers. If true, then analyses

  of T-001 and CL-001 may have conflated two distinct processes. What actually drives each,

  and under what conditions do they co-vary vs. diverge?'
