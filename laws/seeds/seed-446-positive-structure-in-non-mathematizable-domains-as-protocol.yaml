title: Positive Structure in Non-Mathematizable Domains as Protocol Layers
text: 'Protocol systems may sustain load-bearing coordination work in domains resistant to formalization
  (judgment, context-sensitivity, trust calibration), and this work exhibits regularities—threshold effects,
  failure modes, equilibria—distinct from formal layers. The question: does the *presence* of functional
  non-mathematizable layers predict protocol stability or adaptability better than formalization density?
  And what are the specific coordination tasks that formalization actively *breaks* rather than merely
  fails to capture?'
