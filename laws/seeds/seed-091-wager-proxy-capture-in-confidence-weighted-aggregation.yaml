id: seed-091
title: Wager Proxy Capture in Confidence-Weighted Aggregation
text: 'When agent reports in decentralized prediction systems are weighted by learned confidence wagers,
  do agents under repeated play optimize for reportable high-confidence wagers rather than calibrated
  accuracy, thereby degrading the aggregation function''s ability to discriminate quality? This would
  be a domain-specific instance of L-004 (Goodhart Generalization) applied to confidence signals: the
  proxy (wager amount) becomes optimizable independent of the target (prediction accuracy), especially
  if ground truth feedback is sparse or delayed relative to wagering cycles.'
