id: seed-462
title: Mean-Field Legibility as Equilibrium Target Displacement
text: 'When agent-environment feedback is formalized as a computable mean-field function,
  do agents optimizing within that model implicitly optimize for conformity to the
  mean-field assumption itself — i.e., for behavior that makes the aggregate distribution
  predictable and the closure valid? If so, formalization of coordination may not
  reduce coordination costs but displace them: from explicit negotiation to implicit
  pressure toward population-level statistical regularity. Does this generalize to
  other domains where legible aggregate models are introduced as protocol layers?'
