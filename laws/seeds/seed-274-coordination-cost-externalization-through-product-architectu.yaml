id: seed-274
title: Coordination-Cost Externalization Through Product Architecture
text: When a protocol agent faces a coordination constraint (duration matching, inventory balance, regulatory
  capital adequacy) and cannot eliminate the cost through internal optimization, cost displacement occurs
  through changes to the *product or service menu* offered to downstream actors. The cost is not destroyed;
  it reappears as markup distortion, supply reallocation, or quality degradation. This may be a general
  mechanism in multi-layer systems where a constraint at one layer is not independently solvable and becomes
  leveraged into market-facing behavior.
