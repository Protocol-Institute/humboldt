id: seed-003
title: Rules-as-code lowers loophole search cost
text: 'When rules are formalized into machine-readable code, they become auditable,
  differentiable,

  and learnable — which reduces the search cost for strategic actors discovering exploitable

  boundaries. This is distinct from gaming under informal rules; it is the emergence
  of

  adversarial optimization against the protocol specification itself. Formalization
  may trade

  coordination clarity for a new vulnerability class.'
