title: Legibility Preference in Adversarial Detection Under Distributed Agency
text: 'In detection tasks where the target (deepfake content) is itself generated by a legible, optimizable
  system, observers preferentially weight advice from agents with explicit reasoning traces (LLMs) over
  peer consensus, even when peer consensus aggregates decentralized evidence. This suggests that *legibility
  of advisor reasoning* may be a stronger determinant of reliance than *quality of signal source* or *diversity
  of evidence*. The mechanism may generalize to any safety-critical protocol where the threat is model-generated
  and the advisor is also model-based: homology between threat and authority may substitute for independent
  validation.'
