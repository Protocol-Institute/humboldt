id: seed-047
title: C-047-computable-rules-boundary-search-amplification
text: 'When regulatory obligations become more computable (machine-readable, testable,
  and

  with precise enforcement signals), firms cluster more sharply near the legal boundary

  rather than redistributing toward genuine compliance. Conduct boundary mass increases

  from 0.367 to 0.411 under computable static rules vs. ambiguous rules, and consumer

  harm also rises (0.175 to 0.202). This is not a measurement artifact: the mechanism

  is that computable rules lower the cost of boundary search — firms can more precisely

  learn what minimally compliant behavior looks like and optimize to it. The key estimand

  distinction is between signal boundary mass (where the enforcement signal places
  firms)

  and conduct boundary mass (where actual conduct is). Computable rules raise both,
  but

  only anti-gaming adaptive design reliably reduces conduct harm. Strong connection
  to

  CL-001: formalization doesn''t just resist revision, it actively recruits boundary-seeking

  behavior that makes the substantive purpose of the protocol harder to enforce over
  time.

  Evidence quality: high (ABM+RL simulation, 2.88M firm-period panel, paired tests).'
