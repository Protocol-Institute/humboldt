id: seed-090
title: Factorization as Capture Displacement, Not Elimination
text: 'When advice-evaluation protocols are factorized to prevent self-scoring, does the optimization
  pressure migrate from the adviser-scorer loop to the decision-maker–external-labeler loop? Under what
  conditions does externalized labeling introduce *new* misalignment (e.g., label drift, institutional
  capture of the labeler, systematic inversion of ground truth) that exceeds the original self-resolution
  hazard? The generalization: architectural separation of measurement from decision in any protocol system
  may relocate rather than resolve Goodhart capture—the relevant question is not whether factorization
  works in isolation, but whether it is stable under pressure to optimize the new boundary.'
