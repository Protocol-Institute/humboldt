id: seed-559
title: Malfunction Legibility Without Institutional Response Trigger
text: In AI systems subject to continuous optimization and public deployment, measurable
  performance degradation can accumulate and become externally observable without
  triggering institutional response or formal recalibration, particularly when (a)
  the system remains operationally functional for most use cases, (b) the evaluation
  metrics used internally remain uncorrelated with the external degradation signal,
  and (c) institutional incentives favor continuation over diagnosis. This is a special
  case of L-013 and may indicate that paradigm-locked anomaly tolerance operates not
  only at the diagnostic level but at the *response* level — anomalies can be recognized
  without triggering corrective protocol shifts.
