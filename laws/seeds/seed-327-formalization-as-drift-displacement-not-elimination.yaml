id: seed-327
title: Formalization as Drift Displacement, Not Elimination
text: 'When drift in an agentic system is addressed by formalizing the information source (e.g., trust-tiered
  ledgers, timestamped metrics), does the system eliminate drift or redirect optimization pressure to
  the formalization layer itself? In this case, the librarian becomes a legible target for metric capture
  and source manipulation. The hypothesis: formalization of epistemic authority in multi-agent systems
  creates a new, harder-to-audit attack surface without addressing the underlying incentive structure
  that produced drift in the first place.'
