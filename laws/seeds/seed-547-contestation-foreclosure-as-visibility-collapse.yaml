id: seed-547
title: Contestation Foreclosure as Visibility Collapse
text: 'Protocol success produces foreclosure of contestation not through enforcement, but through architectural
  internalization that renders the protocol invisible as a *choice* — it becomes infrastructure, background,
  assumed. The productive empirical window for studying protocol dynamics is the phase before visibility
  collapses; after internalization, the protocol becomes forensically opaque at the contestation layer.
  This suggests: (1) research designed to capture protocol behavior must catch systems during adoption
  conflict, not post-stabilization; (2) ossification may be detectable as a loss-of-arguability rather
  than a loss-of-modifiability.'
