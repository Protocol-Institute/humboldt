title: Opinion-Legibility Saturation in Heterogeneous Coordination
text: 'In decentralized coordination protocols where agents must infer partner preferences ("opinions")
  to select among compatible strategies, does increased strategy expressiveness reduce or merely relocate
  coordination cost? Specifically: does the cost of reliable preference inference scale such that systems
  with high strategy layering approach or exceed the coordination cost of systems requiring explicit pre-coordination?
  This would suggest a coordination cost floor independent of protocol architecture.'
