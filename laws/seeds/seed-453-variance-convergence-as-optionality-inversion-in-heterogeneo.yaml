title: Variance Convergence as Optionality Inversion in Heterogeneous Protocol Systems
text: 'In protocol systems spanning multiple groups with incommensurable local configuration spaces, global
  optionality need not decrease monotonically—it may instead be *redirected* as a decrease in cross-group
  behavioral variance. Groups individually lock into distinct configuration spaces (losing local optionality)
  while producing increasingly similar outputs (reducing observable variance). This creates a measurement
  trap: protocol constraint accumulation becomes invisible if the metric is global behavioral convergence
  rather than configuration freedom. The mechanism: formalization and coordination pressure migrate the
  measurement locus from "what local choices remain open" to "how similar do group behaviors appear,"
  rendering local optionality collapse compatible with apparent global coordination success.'
