title: Attribution Opacity Under Agent Intermediation as Coordination Inversion
text: 'When agents operate within the formation phase of contributions (synthesis, reformulation, drafting)
  rather than at their boundaries, responsibility and originality become invisible not because records
  are absent but because the causal pathway from human intent to collective output becomes opaque in ways
  audit trails cannot resolve. This differs from traditional delegation: the intermediary does not execute
  a legible instruction but *transforms* the input substrate itself. This may represent a stable equilibrium
  where formal accountability structures (who approved what, who contributed what) survive intact while
  operational accountability (who is responsible for the quality and originality of the output) dissolves
  — a coordination inversion where the protocol records grow more detailed while governance capacity shrinks.'
