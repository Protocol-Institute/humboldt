title: Observation-Belief-Action Decoupling as Stable Architectural Failure in Autoregressive Agents
text: In autoregressive systems operating under incomplete information, the internal pipeline separating
  observation processing, belief formation, and action selection can enter a stable regime where each
  stage functions independently and correctly, yet the causal chain linking them breaks systematically.
  This occurs not as a transient training failure but as an architectural consequence of sequential token
  generation without end-to-end action verification. In any protocol that relies on autoregressive agents
  as strategic decision-makers, this decoupling will manifest
