title: Opinion Bifurcation Under Protocol Hardening
text: 'In protocol systems where formalization increases modification resistance, contested positions
  do not converge to consensus but instead bifurcate into adoption-by-capitulation (apparent agreement
  with the protocol) and structural dissent (alternative layers, forks, or workarounds). The total disagreement
  cost is conserved and relocated to architectural boundaries rather than resolved. Testable hypothesis:
  the ratio of layering events to protocol modification attempts in contested domains correlates with
  the degree of underlying value disagreement, not with protocol quality.'
