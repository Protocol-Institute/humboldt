triggers:
  advance: >
    Mechanism demonstrated in 2+ genuinely independent refinement-loop contexts (e.g., code
    generation + legal drafting + scientific writing) showing that oracle-score improvement
    diverges from domain-fitness measures after a consistent number of refinement cycles, with
    the rate of divergence shown to be a function of oracle expressiveness relative to domain
    dimensionality.
  challenge: >
    A case where a tight iterative refinement loop against a fixed computable oracle produced
    measurable domain-fitness improvement (validated by external ground truth), sustained over
    many cycles, without oracle retraining—demonstrating that oracle-optimization and domain-fitness
    improvement can remain coupled under tight iteration.
