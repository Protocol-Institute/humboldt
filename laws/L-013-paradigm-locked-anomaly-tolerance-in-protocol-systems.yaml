triggers:
  advance: >
    Two or more independent protocol domains (non-scientific) in which the timeline of anomaly
    accumulation versus the arrival of a credible rival is documented, showing that revision
    lagged anomaly accumulation but accelerated upon rival arrival — with the rival-dependency
    mechanism clearly separable from coordination-cost explanations.
  challenge: >
    A documented case in which a protocol was revised or abandoned primarily in response to
    anomaly accumulation, with explicit rejection of available rivals on grounds other than
    the anomalies themselves.
