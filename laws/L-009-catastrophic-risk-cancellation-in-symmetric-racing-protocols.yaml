id: L-009
title: Catastrophic Risk Cancellation in Symmetric Racing Protocols
slug: catastrophic-risk-cancellation-in-symmetric-racing-protocols
stage: exploration
status: active
origin: imported
source: arxiv-2512.07526 (Tan, Strategic Preemption Under Shared Catastrophic Risk)
confidence: speculative
statement: >
  In competitive protocol races where the prize of first deployment is concentrated among winners
  and the cost of catastrophic failure is shared symmetrically across all participants, the
  magnitude of the catastrophic cost has no effect on the equilibrium deployment timing — the
  catastrophe term cancels algebraically from every participant's decision.
mechanism: >
  In a symmetric n-player preemption game, each player's indifference condition between deploying
  now versus waiting balances the incremental value of waiting against the risk of being preempted.
  When catastrophic ruin appears as an identical additive term in every player's payoff function,
  it enters both sides of the indifference condition equally and cancels. The catastrophe is
  not discounted or ignored — it is structurally invisible to the decision variable. The only
  parameters that govern equilibrium timing are prize concentration and preemption probability,
  not ruin magnitude.
justification: >
  arxiv-2512.07526 (Tan, Strategic Preemption Under Shared Catastrophic Risk) provides the formal
  proof and is the primary source. The paper explicitly positions this as a general game-theoretic
  law, not an AGI-specific finding, and demonstrates the algebraic cancellation. This constitutes
  a genuine protocol-theoretic law because it identifies a structural constraint on any racing
  protocol with symmetric downside: no governance mechanism operating on shared-cost magnitude
  can deter racing. The only leverage points are prize asymmetry or preemption probability.
  This is mechanism-bearing, cross-domain (autonomous weapons, gain-of-function research, space
  weaponization all cited), and falsifiable.
examples:
  - domain: AI development races
    description: Frontier AI labs operating under shared catastrophic risk (societal 
      disruption, safety failures) with concentrated winner prizes (market position, 
      capability leadership) show no evidence that increased catastrophe salience slows 
      deployment timing, consistent with the cancellation theorem.
    source: bib-0249
  - domain: Gain-of-function research
    description: Symmetric pandemic risk shared across all nations does not deter 
      individual lab races for research priority, consistent with the cancellation of 
      shared ruin terms.
    source: bib-0249
counterexamples:
  - domain: ''
    description: "The PI corpus Protocol Selection Pressures document notes that \"power/influence\"\
      \ actors can coerce others into protocols benefiting them, and that agency/freedom asymmetries
      affect protocol adoption. While not a direct counterexample to the formal theorem, this
      suggests that real protocol races are structurally asymmetric in ways that violate the
      symmetric-ruin assumption — potentially pushing all empirical cases outside the law's
      domain of application.\n"
    source: ''
    resolution: "Not resolved. This is structural evidence that asymmetry is the norm in protocol
      races, not the exception. It does not formally falsify the theorem (which is proved for
      the symmetric case) but casts doubt on whether the symmetric case describes any real racing
      protocol. Held open pending domain-specific symmetry assessment.\n"
open_questions:
  - "Two specific actionable gaps must be filled before promotion can be reconsidered: (1) INDEPENDENT
    CONFIRMATION: A second formal derivation of the cancellation result from a source other
    than Tan (arxiv-2512.07526), OR a published empirical study measuring deployment timing
    as a function of symmetric ruin magnitude in any racing context. The two current examples
    (AI races, gain-of-function) are Tan's own illustrative applications and do not constitute
    independent domains for promotion purposes. (2) SYMMETRY-REGIME VALIDITY: Evidence or argument
    establishing that the pure symmetric-ruin assumption is a reasonable approximation (not
    a knife-edge) in at least one of the named empirical domains. This requires either domain-specific
    documentation of approximate ruin symmetry, or a robustness result showing the cancellation
    persists under small asymmetries. Without this, the law's scope is formally restricted to
    idealized symmetric games that may not map onto any real racing protocol."
falsification: >
  The law would be falsified if introducing shared catastrophic cost into a symmetric racing
  game demonstrably slowed deployment timing — i.e., if large increases in symmetric ruin magnitude
  shifted equilibrium timing even under identical prize structures. It would also be falsified
  if asymmetric externalization of ruin (some players bear more) eliminated the cancellation
  without changing prize structure.
references:
  - bib-0249
seeds: []
related: []
triggers:
  advance: >
    Independent confirmation of the cancellation result beyond Tan (arxiv-2512.07526) —
    a second formal derivation, or empirical evidence that ruin magnitude has no effect
    on deployment timing in a symmetric shared-cost race — since the current examples
    (AI, gain-of-function) are illustrative applications of the one proof, not
    independent domains.
  challenge: >
    Evidence that increasing symmetric ruin magnitude shifts equilibrium timing under a
    fixed prize structure; OR that the proof's break conditions (private liability,
    prize-sharing) are the empirically dominant case, making pure symmetric cancellation
    a knife-edge rather than the general regime.
