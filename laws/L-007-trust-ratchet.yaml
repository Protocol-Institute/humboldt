id: "L-007"
title: "Trust Ratchet in Safety-Critical Protocols"
slug: "trust-ratchet"
stage: valley
status: active
origin: discovered
source: null
confidence: provisional

statement: >
  Trust in safety-critical protocols accumulates as a function of operational age and
  stability rather than technical correctness, creating a systematic bias toward
  under-updating when technical conditions change. Safety-critical protocols are most
  trusted precisely when they have not been tested under the new conditions that make
  them most likely to fail.

mechanism: >
  Trust updates asymmetrically: each incident-free operation adds a small positive
  increment; correction requires a salient incident, which the protocol is
  specifically designed to prevent. Incident-free history is cognitively accessible
  evidence; technical incorrectness is often not. The ratchet structure: clicking
  forward easily (every safe day adds trust), resisting backward motion (no incident
  means no salient evidence of incorrectness). Age and stability thereby become the
  primary evidence of reliability, independent of design validity.
  Corollary: the way to make safety-critical protocols updatable is not to argue for
  a better protocol but to first establish a trusted update meta-protocol, which must
  itself accumulate survival-evidence before object-level protocols can be updated
  without trust destruction.

justification: >
  The cheap trick came from an M-001 random-links juxtaposition of coal mine safety
  history with the availability heuristic literature (DS-007). Sensemaking rejected
  the pure cognitive-bias framing (suggests individual debiasing as the fix, missing
  the institutional dimension) for the structural account: trust as a lagging
  indicator with asymmetric update rates. The apparent counterexamples are the most
  interesting support: TCAS required regulatory mandate, and Cochrane-style
  systematic review is an institution deliberately designed to override trust-based
  conservatism — both are meta-protocols, exactly what the corollary predicts.
  Flagged honestly: this arc has been the program's stagnant valley — evidence has
  not grown since opening, and the near-miss crux is untested.

examples:
  - domain: "aviation"
    description: "Runway incursion protocols: trusted procedures contributed to near-misses;
      incidents were required to trigger standardization updates."
    source: "Aviation safety protocol literature (FAA, ICAO)"
  - domain: "medical"
    description: "Antiseptic handwashing: Semmelweis could not get adoption despite technical
      evidence; catastrophic mortality data was required."
    source: null
  - domain: "nuclear"
    description: "NRC regulations defer to established procedures; updating technically correct
      but operationally untested protocols faces high institutional resistance."
    source: null
  - domain: "mining"
    description: "Historical ventilation protocols trusted for decades; updates required accidents
      rather than anticipating geological change."
    source: "Coal mine safety protocol literature"

  - domain: Paradigm anomaly tolerance
    description: 'seed-028 (Kuhn, normal-science-anomaly-tolerance) establishes that the paradigm
      provides assurance that anomalies will eventually be solved by the current framework —
      this is the positive function of the ratchet, not just inertia. Applied to L-007: safety-critical
      protocol communities tolerate accumulating anomalies not irrationally but because the
      trust accumulated through operational stability functions as a credible prior that anomalies
      are solvable within the existing framework. This is a mechanism refinement for L-007.'
    source: seed-028 (C-028-normal-science-anomaly-tolerance)
counterexamples:
  - description: "Aviation TCAS adopted proactively, before collision data."
    resolution: "Required regulatory mandate — voluntary trust revision was not forthcoming.
      Supports the law: mandatory override of trust-based conservatism was needed."
    source: null
  - description: "Some medical protocols update via systematic review (Cochrane) without incidents."
    resolution: "Institutionally designed to override trust-based conservatism — these are update
      meta-protocols, which the corollary predicts. Supports rather than falsifies."
    source: null

  - domain: Scientific paradigm change
    description: "seed-031 (Kuhn, trust-collapse-rival-availability) establishes that anomaly
      accumulation without a rival candidate produces malaise but not abandonment — a direct
      mechanism for why trust ratchets persist even under known technical failure. However,
      this also implies L-007 is not just age-based: it requires the additional condition that
      no credible rival exists. Cases where a viable alternative IS available should show faster
      trust collapse, which would constrain L-007's scope."
    source: seed-031 (C-031-trust-collapse-rival-availability)
    resolution: OPEN
open_questions:
  - "Do near-miss reporting systems show faster trust revision? If yes, this is a design lever
    for trust updating without catastrophic failure — the primary untested crux."
  - "Compounding with L-001: do widely-adopted safety protocols face ossification resistance
    and trust-ratchet resistance simultaneously?"
  - "What structurally distinguishes safety-critical protocols — consequence severity, or something
    in the protocol design itself?"

falsification: >
  Safety-critical protocols with long incident-free histories that updated rapidly in
  response to technical evidence, without requiring an incident to trigger revision
  (and without a mandate-wielding meta-protocol doing the overriding — those confirm
  the corollary).

references:
