id: L-010
title: Coordination Adoption Nonmonotonicity
slug: coordination-adoption-nonmonotonicity
stage: exploration
status: active
origin: discovered
source: null
confidence: speculative
statement: >
  In protocol systems where agents condition behavior on coordination signals from other adopters,
  adoption is monotonically beneficial only when the signaling/protocol design is co-optimized
  with
  the adoption level. Under fixed (non-co-optimized) design, intermediate adoption ranges can
  raise
  system-level failure rates above those at low or zero adoption, because signal-conditioned
  behavioral change outpaces the safety gains from improved coverage.
mechanism: >
  When adopters of a coordination protocol receive signals that cause them to alter their behavior
  (e.g., reducing precautionary behavior in response to warning signals), the safety benefit
  of the signal depends on the accuracy and completeness of signal coverage. Under partial adoption
  with fixed non-optimal signaling probabilities, the behavioral change induced in equipped
  agents creates new failure modes — they rely on signals that are absent for unequipped counterparties.
  The aggregate failure rate is a non-monotone function of adoption with a potential local maximum
  in intermediate adoption ranges, before coverage becomes dense enough to support the signal-conditioned
  behavior.
justification: >
  seed-050 (C-050-coordination-adoption-nonmonotonicity) provides the formal mechanism from
  V2V communication research, with specific regions (R3 and R4) where this inversion holds.
  This is a general structural property of any protocol where adoption triggers behavioral change
  rather than just adding capability. It is distinguishable from L-001 (ossification under adoption)
  because it concerns safety outcomes during the adoption curve, not governance cost. It is
  cross-domain: vaccination hesitancy under partial coverage, security protocol adoption curves,
  and network trust infrastructure (OAN paper, arxiv-2606.03161) all exhibit analogous intermediate-adoption
  failure modes.
examples:
  - domain: Vehicle-to-vehicle communication
    description: Under partial V2V adoption, equipped drivers condition on warning signals
      and reduce precautionary behavior. In adoption regions R3 and R4, this increases 
      equilibrium accident probability relative to lower adoption rates.
    source: seed-050 (C-050-coordination-adoption-nonmonotonicity)
  - domain: Network trust infrastructure
    description: Agent trust protocols (e.g., OAN) that cause relying agents to reduce 
      verification effort in response to trust signals create analogous 
      intermediate-adoption vulnerabilities when not all counterparties are covered by the
      trust infrastructure.
    source: arxiv-2606.03161 (Xu, OAN White Paper)
counterexamples: []
open_questions:
  - "Two specific gaps must be closed before PROMOTE is possible: (1) DOMAIN CONFIRMATION —
    retrieve and read arxiv-2606.03161 (Xu, OAN White Paper) to confirm whether it actually
    contains a modeled or measured intermediate-adoption failure peak under fixed (non-co-optimized)
    design. Currently this is asserted by analogy only. If it does not, the OAN entry should
    be downgraded to [inference] and the law's second domain is absent. (2) SECOND INDEPENDENT
    DOMAIN — identify at least one domain beyond V2V (and beyond OAN unless gap 1 is closed)
    in which the signal-conditioned behavioral change under partial adoption produces a documented
    failure-rate non-monotonicity. Candidate domains to search: (a) TCAS/aviation collision-avoidance
    under partial fleet adoption — there is external literature on TCAS resolution advisory
    compliance rates creating new failure modes during adoption; (b) vaccination partial-coverage
    with risk-compensation behavior — peer-reviewed epidemiological literature on behavioral
    disinhibition under partial vaccine coverage; (c) TLS/HTTPS mixed-content security warnings
    — user habituation to warning dialogs under partial HTTPS adoption creating intermediate-adoption
    vulnerability peaks. Each candidate must reproduce the fixed-design vs. co-optimized-design
    distinction to count toward the advance trigger."
falsification: >
  The law would be falsified if, under fixed (non-co-optimized) design, the system-level failure
  rate were strictly monotone decreasing in adoption across a broad class of signal-conditioned
  coordination protocols — i.e. if no intermediate-adoption failure peak existed even when the
  signaling policy is held fixed rather than optimized per adoption level. (The optimized-design
  case is expected to be monotone and does not falsify the law.)
