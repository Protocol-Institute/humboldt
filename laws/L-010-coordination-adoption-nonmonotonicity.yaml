    co-optimized-design distinction.
  challenge: >
    A coordination protocol with signal-conditioned behavior in which fixed (non-co-optimized)
    design still yields monotone-decreasing failure in adoption — showing the fixed-design caveat
    is not what produces the nonmonotonicity — or evidence the V2V R3/R4 result does not survive
    the corrected consistency equation.
