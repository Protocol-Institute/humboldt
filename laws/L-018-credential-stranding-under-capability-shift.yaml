id: L-018
title: Credential Stranding Under Capability Shift
slug: credential-stranding-under-capability-shift
stage: exploration
status: active
origin: discovered
source: null
confidence: speculative
statement: >
  In reputation systems where credentials are formalized as discrete, interpretively stable
  tokens, those tokens persist in institutional reliance even after the underlying competency
  they certified has been decoupled by external capability change. The credential continues
  to route decisions as though the certification remained valid, creating systematic misallocation
  proportional to the speed and depth of the capability shift.
mechanism: >
  Formalized credentials reduce verification cost by converting ongoing competence assessment
  into a one-time legibility event. This efficiency gain is what drives adoption, but it also
  means the credential becomes institutionally load-bearing: contracts, access rules, and hiring
  decisions depend on it. When the underlying capability landscape shifts (new tools, paradigm
  changes), the cost of re-verifying competence from scratch exceeds the coordination cost of
  continuing to rely on the existing credential. Institutions rationally preserve the token
  even as its causal grounding erodes, because switching requires coordinated re-assessment
  across all downstream users simultaneously—a collective action problem. The credential ossifies
  not because institutions are irrational but because the stranding cost is diffuse while the
  switching cost is concentrated.
justification: >
  seed-471 provides the core mechanism. The pattern also finds structural support in seed-025
  (data shifts after paradigm acceptance) and seed-027 (Planck principle: institutional knowledge
  trails capability reality). The deep read on V2V adoption nonmonotonicity (arxiv-2606.07873)
  illustrates the general principle that protocol benefits calibrated at adoption time become
  liabilities when environmental conditions shift. This is genuinely distinct from L-001 (ossification
  under adoption pressure) because the driver here is not coordination cost of changing the
  protocol text but the severing of the causal chain between the credential token and the competency
  it names—a semantic failure, not a governance failure.
examples:
  - domain: Professional certification
    description: Medical board certifications issued before widespread AI-assisted 
      diagnostics continue to be required for hospital privileges even when the 
      competencies they assess (unassisted pattern recognition, manual calculation) have 
      been partially supplanted. Credentialing bodies lack mechanisms to re-certify the 
      new competency mix.
    source: seed-471
  - domain: Academic credential systems
    description: Doctoral degrees in fields undergoing computational transformation 
      (genomics, economics) continue to signal methodological competence that may have 
      been superseded by tool availability; hiring committees rely on the degree as a 
      proxy for skills the degree no longer reliably certifies.
    source: seed-471
counterexamples: []
open_questions: []
falsification: >
  A documented case where a major capability shift (affecting >50% of the credentialed competency)
  led to rapid, coordinated de-recognition or revision of the formal credential within a short
  window (under five years), without external regulatory mandate, would refute the claim that
  stranding is structurally driven.
