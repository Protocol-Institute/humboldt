triggers:
  advance: >
    Mechanism confirmed in 2+ genuinely independent credentialing domains (e.g., professional
    licensing AND academic ranking AND security clearance) showing that credential-reliance
    persists measurably beyond the point at which ground-truth competence assessments diverge,
    with the rate of stranding shown to correlate with the discreteness/interpretive stability
    of the credential token.
  challenge: >
    A documented case where a formal credential system rapidly self-revised in response to a
    detected competency gap (without regulatory compulsion), demonstrating that institutional
    actors can overcome the collective action problem without external forcing.
