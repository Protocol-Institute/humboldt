triggers:
  advance: >
    Two or more independent governance contexts with documented evidence that record quality
    was high but governance reconstruction by successor teams failed in ways attributable to
    interpretive continuity loss rather than record gaps — with the distinction between these
    failure modes verified by independent assessment.
  challenge: >
    A distributed governance system with high personnel turnover that maintains interpretive
    continuity over multiple generations of personnel, attributable to a specific protocol feature
    that transfers context without tacit knowledge.
