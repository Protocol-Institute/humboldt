triggers:
  advance: >
    Mechanism confirmed in 2+ genuinely independent domains (e.g., financial markets and labor
    matching and platform recommendation) with empirical measurement of implicit coupling attributable
    to shared infrastructure rather than correlated payoffs, and the boundary condition on guidance-sharing
    fraction stated.
  challenge: >
    A documented competitive market where firms using a common LLM advisor produce no detectable
    price coordination above baseline, under conditions where the model has sufficient market-level
    information to generate focal recommendations.
