id: "L-003"
title: "The Formalization Ratchet"
slug: "formalization-ratchet"
stage: valley
status: active
origin: discovered
source: null
confidence: provisional

statement: >
  Under conditions of stress, conflict, or scaling pressure, informal coordination
  norms tend to be replaced by explicit protocols, and this transition is nearly
  irreversible: once formalized, informal capacity atrophies — people stop developing
  the contextual knowledge and trust that made informality work — so reversion
  requires rebuilding a capacity that was actively degraded, not merely switching
  back to a prior mode.

mechanism: >
  Informal coordination works through shared context and trust, which has carrying
  capacity limits. Under stress, explicit protocols substitute for shared context —
  they work without trust and without shared background knowledge. Once in place,
  the informal capacity atrophies: the practice of developing contextual knowledge
  stops, and the social substrate (relationships, shared language, implicit norms)
  that supported informality degrades. Reversion is therefore not a simple reversal
  but a reconstruction task, executed under conditions hostile to that reconstruction.

justification: >
  The cheap trick (DS-003) separates "why do protocols persist?" from "why can't you
  go back?" — the answer to the second is that the informal alternative no longer
  exists, not that the formal protocol is locked in. Sensemaking rejected generic path
  dependence (doesn't explain why the informal option specifically decays rather than
  remaining available) for the atrophy account: informal capacity requires active
  maintenance, and formalization starves it. Evidence holds across four domains, with
  the strongest signal being practitioners' phenomenology — customary law and clinical
  judgment described as genuinely unavailable after codification, not suppressed. The
  counterexamples cluster around two conditions (externally imposed protocols +
  personnel continuity), which is itself law-shaped: the distinction either becomes a
  scoping condition or collapses the counterexamples.

examples:
  - domain: "organizational"
    description: "Startup → corporate transitions consistently show degraded informal capacity
      post-formalization, not just formal preference."
    source: "Organizational sociology: startup lifecycle literature"
  - domain: "legal (international)"
    description: "Customary international law practitioners describe tacit knowledge of customary
      practice as genuinely unavailable after treaty codification."
    source: "Customary international law → treaty regime literature"
  - domain: "medical"
    description: "Clinical judgment capacity declines in over-protocolized settings; physicians
      report difficulty trusting their own judgment after extended protocol dependence."
    source: "Clinical judgment vs. evidence-based protocol literature"
  - domain: "software"
    description: "Informal API convention maintainers report inability to return to informal
      coordination after versioned specification was imposed."
    source: null

  - domain: Protocol governance under scaling pressure
    description: The Ethereum-as-polity analysis (shallow read, trent_vanepps) documents 
      the arc from informal coordination norms in early Ethereum governance to formalized 
      institutional structures under scaling pressure — a direct observational case for 
      the stress→formalization→irreversibility chain claimed by L-003.
    source: bib-0915
  - domain: Protocol design under environmental pressure
    description: The Schroff working paper (shallow read, c3po) frames formalization not 
      as a design choice but as an adaptive response to measurable stress conditions — 
      scaling bottlenecks, coordination failure, exploit vulnerability. This supports 
      L-003's mechanism while providing a selection-pressure vocabulary that sharpens why 
      the ratchet direction is asymmetric.
    source: bib-0922
  - domain: Repair knowledge standardization
    description: iFixit's transition from crowdsourced repair guides to an NSF-backed 
      formal repairability scoring standard is a live instance of the informal-to-formal 
      transition. The critical question for L-003 is whether the informal repair 
      community's adaptive capacity degrades as the formal standard takes hold — this case
      is worth tracking longitudinally as a falsification test.
    source: bib-0917
  - domain: Protocol paradigm — exemplar vs. rule transmission
    description: "seed-029 (Kuhn on exemplar vs. rule as protocol type) provides a mechanism
      for why informal capacity atrophies after formalization: exemplar-based coordination (tacit,
      perceptually trained, not reducible to rules) is displaced by rule-based coordination
      when protocols are formalized. Once the exemplar tradition is broken — because practitioners
      are trained in the rules rather than in the practice — rebuilding exemplar capacity requires
      a generation of re-immersion, not just rule revision. This supports and mechanistically
      enriches L-003's claim about irreversibility."
    source: seed-029
counterexamples:
  - description: "Post-crisis informality observed in tight-knit teams."
    resolution: "Typically involves externally imposed protocols (not internally developed)
      AND personnel continuity — both favor informal capacity retention. Provisional scoping:
      the law applies to internally developed protocols. OPEN — distinction not yet tested against
      targeted retrieval."
    source: null
  - description: "Open-source projects maintain informal coordination alongside formal specifications."
    resolution: "Likely parallel maintenance (informal capacity actively cultivated alongside
      formal structure) rather than reversion. OPEN — needs investigation."
    source: null

open_questions:
  - "What determines the rate of informal capacity atrophy — duration of formalization, or depth
    of protocol adoption?"
  - "Is the internally-developed vs. externally-imposed distinction a law modifier or a full
    scoping condition?"
  - "Is there a threshold of formalization intensity below which informal capacity is preserved
    (the OSS parallel-maintenance pattern)?"

falsification: >
  Documented cases of organizations successfully reverting from formal protocol to
  informal coordination after the stressor passed, with personnel continuity (ruling
  out social substrate reset via turnover).

references:
  - "Organizational sociology: startup → corporate lifecycle literature"
  - "Customary international law → treaty regime transition literature"
  - "Clinical judgment → evidence-based protocol literature"
  - bib-0915
  - bib-0922
  - bib-0917
seeds: []
related:
