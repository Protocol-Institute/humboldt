falsification: >
  A normative intervention in an adaptive recommendation system that successfully reduced the
  targeted behavior without triggering algorithmic retraining, with evidence that the intervention's
  behavioral signal was not absorbed into the optimization objective, would refute the generality
  of the mechanism.
