triggers:
  advance: >
    Two or more independent documented cases from different platform types (search, content
    recommendation, resource allocation) in which a normative intervention triggered measurable
    algorithmic retraining in the direction opposite to the intervention's intent, with the
    retraining mechanism confirmed rather than inferred.
  challenge: >
    A documented case in which an adaptive recommendation system received a normative intervention
    whose behavioral signal did not cause retraining toward the revealed demand — with an account
    of the protocol feature that prevented absorption.
