triggers:
  advance: >
    Mechanism confirmed in 2+ genuinely independent deployment domains with evidence that the
    displacement occurs even when the deploying organization explicitly tracks downstream outcomes
    — i.e., that legibility of the intermediate is sufficient to cause displacement even under
    outcome-awareness.
  challenge: >
    A documented case in which formalizing a prediction as a protocol input increased institutional
    attention to the downstream outcome rather than to prediction quality, with a plausible
    account of why the causal-chain-position mechanism did not fire.
