falsification: >
  A deployed decision protocol in which prediction accuracy improvements reliably and proportionally
  improve measured downstream outcomes across multiple independent evaluation cycles, without
  institutional pressure to decouple the two, would refute the claim that displacement is structurally
  driven rather than contingent on measurement practice.
