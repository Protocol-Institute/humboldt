triggers:
  advance: >
    Mechanism demonstrated in 2+ independent domains by showing (a) output diversity declines
    measurably after formalization/professionalization of the steering layer, (b) the decline
    is not explained by changes in the formal protocol itself, and (c) reintroduction of informal
    steering partially restores diversity.
  challenge: >
    A documented protocol system where legible optimization pressure increased while informal
    steering remained constant, yet output diversity increased—showing that formal optimization
    and novelty are not structurally antagonistic under some conditions.
