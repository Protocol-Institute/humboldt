id: "L-004"
title: "Goodhart Generalization: Metric Capture"
slug: "goodhart-metric-capture"
stage: heavy-lift
status: active
origin: imported
source: "Charles Goodhart (1975), monetary policy targeting — 'When a measure becomes a target,
  it ceases to be a good measure.'"
confidence: supported

statement: >
  Any protocol that uses a measurable proxy for an unmeasurable goal will, under
  sufficient optimization pressure, cause participants to optimize the proxy in ways
  that degrade the underlying goal. The degree of degradation is proportional to the
  optimization pressure and inversely proportional to the fidelity of the proxy.

mechanism: >
  Measurable proxies are imperfect representations of underlying goals. The gap
  between proxy and goal defines the exploitation surface. Under optimization pressure
  (incentive structures, competition, survival pressure), participants discover and
  exploit this surface; the proxy becomes the de facto goal. Protocols intensify the
  original Goodhart dynamic: they codify the proxy into an enforceable rule, so the
  proxy is not merely measured but enforced — raising the optimization pressure and
  adding a new failure surface (gaming the enforcement mechanism itself).

justification: >
  Imported because protocols are mechanisms for coordinating behavior toward goals,
  and nearly all use measurable proxies — the Goodhart mechanism should apply
  wherever they do (DS-004). The protocol-theoretic version adds two things to the
  source law: (1) optimization pressure as an explicit structural variable, making
  the law predictive rather than post-hoc (low-stakes proxy use is relatively safe;
  high-stakes proxy use under competition is reliably toxic); (2) the enforcement
  layer, absent from Goodhart's formulation, which both accelerates degradation and
  creates enforcement-specific failure modes. The source pattern is multiply attested
  across economics, medicine, education, and management — robust enough to count as a
  foundational regularity of measurement-under-optimization.

examples:
  - domain: "financial"
    description: "VaR as proxy for risk: banks optimized portfolios to minimize VaR, concentrating
      tail risks invisible to the metric (2008 crisis)."
    source: null
  - domain: "governmental"
    description: "Crime statistics as proxy for public safety: Compstat-era policing produced
      systematic downgrading of crime reports to improve metrics."
    source: null
  - domain: "academic"
    description: "Citation counts and h-indices as proxies for research quality: optimized via
      citation trading, self-citation networks, salami publishing."
    source: null
  - domain: "medical"
    description: "Clinical trial endpoints as proxies for patient outcomes: development optimizes
      endpoints, sometimes independently of outcomes."
    source: null
  - domain: "software"
    description: "Code coverage as proxy for test quality: optimized by trivial tests that hit
      thresholds without testing behavior."
    source: null

  - domain: Healthcare policy and coding behavior
    description: 'The Medi-Sim paper (arxiv-2605.30680) demonstrates that healthcare billing
      codes function as proxies for care delivery, and that under provider optimization, closing
      one distortion channel migrates pressure to adjacent channels. This is a direct mechanism
      demonstration for L-004: the proxy (billing code) is hit precisely while the underlying
      goal (appropriate care) degrades through pressure migration.'
    source: arxiv-2605.30680 (Wang et al., 2026)
  - domain: Regulatory compliance
    description: 'seed-047 shows that computable, machine-readable regulatory rules increase
      boundary clustering (from 0.367 to 0.411 conduct boundary mass). This extends L-004: not
      only does optimization pressure degrade the proxy-goal relationship, but increasing the
      precision of the proxy measurement accelerates the degradation by reducing the search
      cost for boundary-seeking behavior.'
    source: seed-047 (C-047-computable-rules-boundary-search-amplification)
counterexamples:
  - description: "Well-designed metrics resist capture because achieving the metric requires
      achieving the goal."
    resolution: "Not a counterexample: evidence that Goodhart can be mitigated by proxy design
      (shrinking the exploitation surface)."
    source: null
  - description: "Competitive sports: winning the game largely IS being the better team."
    resolution: "Core metric well-designed, but gameable at the margins (tactical fouling, time-wasting)
      — the law applies at the boundary."
    source: null
  - description: "Continuously revised protocols with rapid proxy iteration may keep closing
      the exploitation surface."
    resolution: "OPEN — the strongest candidate limit on transfer; fast-feedback regulatory
      frameworks are the test case."
    source: null

open_questions:
  - "Does protocol structure itself determine how much optimization pressure it generates, independent
    of the environment?"
  - "What failure modes are specific to protocol enforcement (gaming the enforcer) versus mere
    measurement? This is the remaining valley work."

falsification: >
  A protocol using measurable proxies under sustained optimization pressure that did
  NOT experience metric capture. Near-falsifications where the proxy is near-perfect
  (the proxy IS the goal) approach the definitional boundary rather than refuting.

references:
  - "Goodhart (1975)"
  - "Compstat / crime statistics manipulation literature"
  - "VaR and 2008 tail-risk literature"
seeds: []
related:
  - "L-001"  # enforcement-layer lock-in compounds metric capture
  - "L-003"  # formalization codifies proxies — the entry point for capture

triggers:
  advance: >
    Separation artifact complete: a published protocol-theoretic writeup — not merely
    registration of the import. Requires the enforcement-specific failure mode survey
    (the declared valley remainder) to be folded in.
  challenge: >
    A documented fast-feedback protocol regime that sustained proxy fidelity under
    high optimization pressure over time — survives one assessment pass (would force
    a scoping condition on proxy-revision speed).

