triggers:
  advance: >
    Mechanism confirmed in 2+ genuinely independent safety warning domains (e.g., traffic systems
    and financial risk monitoring and public health) with empirical demonstration that intermediate
    adoption produces worse outcomes than low adoption, with the boundary conditions on adoption
    level and precaution cost structure stated.
  challenge: >
    A documented V2V-type deployment at intermediate adoption levels where aggregate accident
    rates decline monotonically with adoption fraction, demonstrated under realistic conditions
    where warned agents have opportunity to substitute the warning for precaution.
