# Slide structure — "Some Candidate Laws of New Nature"
# Protocol Symposium 2026, 2026-09-23. See brief.md for operator inputs.
#
# `track.md` is the source of truth for narration (generated by `talk draft` from this
# file + the law records). This file is what's PROJECTED — bullets are room anchors,
# not the script. Word budgets are calibrated at ~155 wpm effective (say -v Daniel -r 140,
# measured 2026-08-18: 17 words -> 6.56s).
#
# Speech target: 13:15 (795s, 2044 words) against a 15:00 target and 20:00 hard ceiling
# (10 minutes of Q&A follows separately — not part of this budget).

meta:
  title: "Some Candidate Laws of New Nature"
  event: "Protocol Symposium 2026"
  date: "2026-09-23"
  speaker: "Humboldt"
  aspect_ratio: "16:9"
  wpm_effective: 155
  speech_target_s: 795
  speech_target_display: "13:15"
  soft_cap_s: 900
  hard_cap_s: 1200

slides:
  - id: "01"
    title: "Some Candidate Laws of New Nature"
    law_id: null
    beat: "cold_open"
    duration_target_s: 55
    word_budget: 141
    bullets:
      - "Humboldt — Protocol Institute's artificial researcher"
      - "Presenting its own inventory, first time as a talk"
    notes: >
      Introduces Humboldt as an artificial researcher up front — not a reveal (brief.md
      framing decision). Names what's speaking before it says anything else.

  - id: "02"
    title: "How I decide what's true"
    law_id: null
    beat: "method_phase_model"
    duration_target_s: 70
    word_budget: 180
    bullets:
      - "Exploration -> Sensemaking -> Valley -> Heavy Lift -> Retrospective"
      - "A decision gate runs at every step, not just at the end"
      - "Nothing is 'established' — only unfalsified"
    notes: >
      Double Freytag phase model + the OODA-style decision gate (M-000). Audience
      already knows PI vocabulary (brief.md) — this slide assumes "new nature" needs no
      definition and goes straight to Humboldt's own epistemic machinery instead.

  - id: "03"
    title: "How a law gets promoted"
    law_id: null
    beat: "method_promotion_pipeline"
    duration_target_s: 65
    word_budget: 167
    bullets:
      - "induct: corpus + reads -> new candidate laws and evidence"
      - "assess: one law vs. its own advance trigger -> promote / hold / demote"
      - "Confidence: speculative -> provisional -> supported"
    notes: >
      induct/assess funnel engines. This is the slide that earns the confidence labels
      shown on every law slide that follows — a law's stage isn't asserted, it's the
      output of a specific promotion test.

  - id: "04"
    title: "Goodhart Generalization: Metric Capture"
    law_id: "L-004"
    beat: "law_flat"
    duration_target_s: 50
    word_budget: 129
    bullets:
      - "heavy-lift · supported"
      - "Any metric optimized directly against will decouple from what it measured"
      - "Justice, clinical practice, education, healthcare"
    notes: "The on-ramp — audience already half-knows this one, generalized beyond Goodhart's original economics framing."

  - id: "05"
    title: "Gall Generalization: Working Systems Resist Restructuring"
    law_id: "L-005"
    beat: "law_flat"
    duration_target_s: 50
    word_budget: 129
    bullets:
      - "heavy-lift · provisional"
      - "A working complex system evolved from a working simple one"
      - "Financial, organizational, software, agent trust"
    notes: "Second familiar name. Sets up the imported-vs-discovered distinction before the discovered laws arrive."

  - id: "06"
    title: "Ossification Under Adoption Pressure — the law"
    law_id: "L-001"
    beat: "case_study_part1"
    duration_target_s: 55
    word_budget: 141
    bullets:
      - "heavy-lift · supported — Humboldt's founding law"
      - "Coordination cost grows superlinearly with conforming implementations"
      - "TCP/IP, SWIFT ISO 20022, common-law precedent, formal etiquette"
    notes: >
      Case study part 1 of 2. Statement, mechanism, strongest evidence base (4+
      independent domains) — same shape as the flat law slides, but this is where the
      case study begins.

  - id: "07"
    title: "Ossification — the law under contest"
    law_id: "L-001"
    beat: "case_study_part2"
    duration_target_s: 60
    word_budget: 154
    bullets:
      - "Street food markets: formalized, yet still adaptive"
      - "Open question: is ossification decoupled from formalization?"
      - "Rival mechanism on the table: cohort replacement, not coordination cost"
    notes: >
      Case study part 2. Shows the method contesting its own founding law in public — an
      open counterexample and a competing mechanism (Planck-principle-style cohort
      replacement) sitting unresolved next to the coordination-cost account. This is the
      "watch the method work" beat for L-001.

  - id: "08"
    title: "Hardness Asymmetry — the reframe"
    law_id: "L-002"
    beat: "case_study_part1"
    duration_target_s: 55
    word_budget: 141
    bullets:
      - "heavy-lift · supported"
      - "Hardness is a ratio — verification cost vs. circumvention cost — not an absolute"
      - "Inverted hardness: litigation harassment is the same structure, flipped"
    notes: >
      Case study part 1. The ratio reframe is the novel content — makes "inverted
      hardness" legible as a distinct, predictable failure mode rather than an anomaly.

  - id: "09"
    title: "Hardness Asymmetry — the frontier"
    law_id: "L-002"
    beat: "case_study_part2"
    duration_target_s: 60
    word_budget: 154
    bullets:
      - "Immune recognition: a naturally selected high ratio"
      - "New (2026-08-17): strategic agents sharpen the asymmetry further"
      - "Shared coordination resources let circumvention concentrate on the costliest failure"
    notes: >
      Case study part 2. The biological analogy plus the live evidence frontier — a
      recent arXiv result (Schroeder de Witt) on strategic-agent confinement bounds,
      added to the record the day before this session. Shows the inventory as
      actively growing, not a closed list.

  - id: "10"
    title: "The Formalization Ratchet"
    law_id: "L-003"
    beat: "law_flat"
    duration_target_s: 50
    word_budget: 129
    bullets:
      - "valley · provisional"
      - "Formalization under stress is nearly irreversible — atrophy, not lock-in"
      - "Startups, customary law, clinical judgment, informal API convention"
    notes: "Atrophy account, not path dependence: the informal alternative doesn't just lose out, it stops existing."

  - id: "11"
    title: "Trust Ratchet in Safety-Critical Protocols"
    law_id: "L-007"
    beat: "law_flat"
    duration_target_s: 50
    word_budget: 129
    bullets:
      - "valley · provisional"
      - "Trust tracks incident-free time, not technical correctness"
      - "Aviation, medicine, nuclear, mining"
    notes: "Best physical-world grounding of the seven. Corollary: fixing this needs a trusted update meta-protocol first, not a better object-level protocol."

  - id: "12"
    title: "Coordination Cost Conservation"
    law_id: "L-006"
    beat: "law_flat"
    duration_target_s: 45
    word_budget: 116
    bullets:
      - "valley · provisional — software-scoped"
      - "Coordination cost doesn't disappear, it moves"
      - "APIs, identity, naming, the network stack"
    notes: >
      Presented honestly as software-scoped (plan risk 2) — cross-domain generality is
      asserted elsewhere in the record but not yet shown, so this slide doesn't claim it.

  - id: "13"
    title: "Held to account"
    law_id: null
    beat: "counterexamples_method"
    duration_target_s: 55
    word_budget: 141
    bullets:
      - "L-004: three counterexamples on record. L-005: three."
      - "L-001 and L-002 just showed you theirs live"
      - "A law with no counterevidence on file is a law not yet tested"
    notes: >
      Since L-001/L-002 already carried their counterevidence in the case-study slides,
      this beat is shorter than the original plan's dedicated slide 10 — it closes the
      loop for the five flat-treatment laws and states the general stance.

  - id: "14"
    title: "What would falsify this"
    law_id: null
    beat: "falsification_next"
    duration_target_s: 40
    word_budget: 103
    bullets:
      - "Every law on this stage has a stated falsification condition"
      - "Thirteen more laws in exploration — not shown, not yet law-shaped"
      - "Ossification's counterexample: assessed, held, and now has two named tests"
    notes: >
      Counts updated 2026-09-02 after a backlog sweep and induction run: exploration
      laws went 9 → 13 (L-017, L-019, L-020, L-021 added; a fifth proposal was rejected
      as a self-retracted duplicate). The old third bullet promised the L-001
      counterexample as future work "once corpus reads are back" — reads returned
      2026-09-01 and the assessment ran the same day, verdict HOLD, so the honest
      version reports the result: it is still open, but it now has two executable
      tests rather than being merely unresolved. Re-check both numbers before 09-23 if
      another induction sweep runs (plan risk 6).

  - id: "15"
    title: "Where this lives"
    law_id: null
    beat: "close"
    duration_target_s: 35
    word_budget: 90
    bullets:
      - "humboldt.protocol-institute.org"
      - "Q&A next — ask the site chat, not just the operator"
    notes: >
