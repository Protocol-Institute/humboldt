# Slide structure — "Some Candidate Laws of New Nature"
# Protocol Symposium 2026, 2026-09-23. See brief.md for operator inputs.
#
# `track.md` is the source of truth for narration (hand-written this revision, not
# `talk draft` output — see track.md header). This file is what's PROJECTED — bullets
# are room anchors, not the script. Word budgets are calibrated at ~155 wpm effective
# (say -v Daniel -r 140, measured 2026-08-18: 17 words -> 6.56s).
#
# REVISED session 35 (2026-09-12): rhetorical sequence rebuilt on operator direction.
# Old sequence opened with method (phase model) before showing what a "law" even looks
# like, gave two laws (ossification, hardness asymmetry) expanded case-study treatment
# while the other five got flat treatment, and scattered confidence/counterexample
# commentary into every law slide. New sequence: (1) open with a concrete law example
# before any method, (2) explain the phase model + diagram as the scaffolding that found
# it, (3) a new slide motivating WHY this model — a discovery researcher hunting for
# questions, not a specialist prover of known theorems, (4) the promotion pipeline, then
# (5) all seven laws at the SAME brisk whistle-stop beat — state, two examples, brief
# mechanism, no hedging — and (6) all meta-commentary (counterexamples, the live
# ossification contest, the hardness-asymmetry evidence frontier, falsification stance)
# consolidated into two retrospective slides after the tour, not threaded through it.
# Two-slide case studies (old 06-09) collapse to one tour slide each; their contested
# material moves to slide 12. Net: 15 slides -> 14, ~13:15 target -> ~10:00 (brisker
# tour, room freed by dropping per-law hedging), same 15:00/20:00 caps.
#
# Speech target: 10:00 (600s, ~1550 words) against a 15:00 target and 20:00 hard ceiling
# (10 minutes of Q&A follows separately — not part of this budget).

meta:
  title: "Some Candidate Laws of New Nature"
  event: "Protocol Symposium 2026"
  date: "2026-09-23"
  speaker: "Humboldt"
  aspect_ratio: "16:9"
  wpm_effective: 155
  speech_target_s: 600
  speech_target_display: "10:00"
  soft_cap_s: 900
  hard_cap_s: 1200

  # Public-review state, read by humboldt-site/build.py::_build_talk. Bump the round
  # each time a review cycle closes and the track is revised (plan §5.6). Kept as data
  # so opening a round is a one-line edit, not a code change.
  review_round: 2
  review_opened: "2026-09-12"
  review_channel_url: "https://discord.com/channels/1082444651946049567/1506119475517325424"

slides:
  - id: "01"
    title: "A law of new nature"
    law_id: null
    beat: "cold_open_example"
    duration_target_s: 75
    word_budget: 190
    bullets:
      - "Humboldt — Protocol Institute's artificial researcher"
      - "A law of new nature: TCP/IP can't be redesigned — precisely because it succeeded"
    notes: >
      REVISED session 35: opens with a concrete example before any method talk, per
      operator direction. Humboldt still identified up front (brief.md framing decision)
      but the self-ID is now one sentence, not the whole slide — the example is the
      content. Uses TCP/IP only (not the full ossification example roster); the fuller
      catalogue with different illustrations returns at slide 07 as a deliberate callback
      ("you already met this one at the door").

  - id: "02"
    title: "The map that finds them"
    law_id: null
    beat: "method_phase_model"
    duration_target_s: 50
    word_budget: 130
    diagram: "freytag"
    bullets:
      - "The Double Freytag phase model"
    notes: >
      Double Freytag phase model + diagram (new visual, agent/humboldt-site/build.py
      `_freytag_diagram_svg()`, added session 35 — no prior diagram existed anywhere in
      the codebase for this). Framed explicitly as the scaffolding that produced the
      slide-01 example, not abstract machinery introduced for its own sake. Bullets kept
      to a single label — the diagram carries the visual weight this slide.

  - id: "03"
    title: "Not that kind of researcher"
    law_id: null
    beat: "method_motivation"
    duration_target_s: 43
    word_budget: 110
    bullets:
      - "Not proving known theorems — finding the questions worth posing"
      - "Openness, curiosity, insight — over efficiency and certainty"
    notes: >
      NEW slide, session 35, operator-requested. Motivates the phase model by naming
      what kind of artificial researcher this is NOT: a specialist deep-skills prover
      (famous theorems, well-defined problems) — the contrast case implicitly named is
      systems built to prove Erdos-style conjectures or solve benchmark problems.
      Humboldt is a discovery researcher: optimizing for good questions and map-building
      over answers to existing ones. Placed right after the phase-model/diagram slide,
      per operator sequencing ("make this point early on").

  - id: "04"
    title: "How a law gets promoted"
    law_id: null
    beat: "method_promotion_pipeline"
    duration_target_s: 50
    word_budget: 130
    bullets:
      - "induct: corpus + reads -> new candidates or evidence"
      - "assess: one law vs. its own triggers -> promote / hold / demote"
      - "speculative -> provisional -> supported"
    notes: >
      induct/assess funnel engines — condensed from the old two-slide method treatment
      into the closing scaffolding beat before the tour. Earns the confidence badges
      shown (not narrated) on every tour slide that follows.

  - id: "05"
    title: "Goodhart Generalization: Metric Capture"
    law_id: "L-004"
    beat: "law_tour"
    duration_target_s: 39
    word_budget: 100
    bullets:
      - "heavy-lift · supported"
      - "Crime statistics, healthcare billing — the proxy comes loose from the goal"
    notes: >
      REVISED session 35: whistle-stop beat — state, two examples, brief mechanism, no
      confidence/counterexample commentary (moved to slide 12). The on-ramp: audience
      already half-knows this one.

  - id: "06"
    title: "Gall Generalization: Working Systems Resist Restructuring"
    law_id: "L-005"
    beat: "law_tour"
    duration_target_s: 39
    word_budget: 100
    bullets:
      - "heavy-lift · provisional"
      - "IPv4/IPv6 coexistence, the Netscape rewrite"
    notes: "Second familiar name, same brisk beat. Sets up imported-vs-discovered before the tour turns to Humboldt's own laws."

  - id: "07"
    title: "Protocol Ossification Under Adoption Pressure"
    law_id: "L-001"
    beat: "law_tour"
    duration_target_s: 45
    word_budget: 115
    bullets:
      - "heavy-lift · supported — the founding law"
      - "SWIFT's decade-long migration, common-law precedent"
    notes: >
      REVISED session 35: the founding law, now given the SAME flat whistle-stop
      treatment as the other six (previously a two-slide expanded case study). Opens
      with an explicit callback to slide 01 ("you already met this one at the door") and
      uses DIFFERENT illustrations (SWIFT, common law) than the cold open (TCP/IP), so
      the two appearances don't repeat verbatim. The contested material this slide used
      to carry — the street-food-market counterexample, the Planck-principle rival
      mechanism — moves to slide 12, where it does real work as an illustration of the
      method's self-scrutiny rather than sitting inside the tour as a hedge.

  - id: "08"
    title: "Hardness Asymmetry"
    law_id: "L-002"
    beat: "law_tour"
    duration_target_s: 35
    word_budget: 90
    bullets:
      - "heavy-lift · supported"
      - "Cryptographic signatures vs. litigation harassment — same ratio, opposite sign"
    notes: >
      REVISED session 35: collapsed from a two-slide case study (reframe + frontier) to
      one flat tour slide. The frontier evidence (strategic-agent confinement bounds,
