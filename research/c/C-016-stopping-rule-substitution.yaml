content: |
  Rittel and Webber note that planners stop work on wicked problems not for reasons inherent
  in the problem's logic but for external reasons — money, time, patience. A protocol adoption
  appears to substitute an artificial stopping rule for the absent natural one: the protocol
  declares *this* to be the test of compliance, *this* the criterion of success. But if the
  stopping rule is politically chosen rather than logically derived, then the compliance test
  built into the protocol is also political — and the people subject to the protocol are being
  evaluated against a criterion whose origin and legitimacy are invisible to them.
