content: |
  In markets that reward novelty, competitive pressure reverses the homogenization produced
  by shared generative AI infrastructure. Stronger competition induces greater diversity
  in outputs (formally proven, empirically validated in Scattergories word game with 6
  LLMs). A model that is benchmark-optimal in isolation (highest single-answer accuracy)
  can be competitively inferior under strong competition because it cannot diversify its
  correct-answer distribution sufficiently. The equilibrium diversity is less than socially
  optimal, but the competitive force substantially mitigates monoculture. This is relevant
  to CL-001 as a boundary condition: algorithmic monoculture (a form of protocol
  lock-in at the output distribution level) is not a stable long-run equilibrium in
  competitive markets — it requires either monopoly or coordination-rewarding payoff
  structures to persist. Evidence quality: high (game-theoretic model with formal proofs,
  empirical validation across multiple LLMs and task types including text-to-image).
