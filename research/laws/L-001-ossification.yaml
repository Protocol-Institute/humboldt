id: "L-001"
name: "Protocol Ossification Under Adoption Pressure"
statement: >
  Protocols that achieve widespread adoption become progressively harder to modify,
  independent of the quality of proposed improvements, because the cost of coordinating
  change grows superlinearly with the number of conforming implementations.
type: lifecycle
confidence: candidate
domains:
  - "software: TCP/IP, HTTP/1.1 → HTTP/2 transition timelines"
  - "financial: SWIFT, ISO 20022 migration"
  - "legal: common law precedent stickiness"
  - "social: established etiquette forms resistant to deliberate reform"
related_laws:
  - L-005  # Gall's Law — working systems resist restructuring
mechanism: >
  Each conforming implementation represents a sunk cost in the existing protocol.
  Backward-incompatible change requires simultaneous coordination of all implementations.
  Coordination cost is superlinear in the number of parties (see Metcalfe's Law).
  Therefore modification cost grows faster than adoption. The protocol becomes a
  coordination trap: widely used precisely because of its properties, and now locked
  into those properties by that very usage.
falsification_conditions: >
  A protocol achieving wide adoption that was subsequently modified with proportionally
  less difficulty than a narrowly-adopted protocol would constitute a counterexample —
  provided the modification required true backward-incompatibility (not merely optional
  extension). A small, well-coordinated ecosystem that can update in lockstep (e.g.,
  a closed corporate standard) does not falsify the law, as it lacks the distributed
  adoption structure the law applies to.
counterexamples:
  - >
    BGP optional attributes and TCP options allow some extension without full coordination
    — but these are forward-compatible extensions, not modifications of existing behavior.
    The law applies to incompatible changes, not additive ones.
  - >
    TLS version deprecation proceeded faster than expected in some contexts (browsers forced
    the transition). Suggests that asymmetric power among implementors (powerful enforcement
    nodes) can accelerate coordination beyond the naive prediction.
evidence: []
notes: >
  Related to the general observation that adoption and adaptability are in tension.
  This may be a special case of a more general conservation law: coordination capacity
  is finite, and adoption consumes it, leaving less for modification.
registered: "2026-05-20"
