id: "L-003"
name: "The Formalization Ratchet"
statement: >
  Under conditions of stress, conflict, or scaling pressure, informal coordination
  norms tend to be replaced by explicit protocols, and this transition is nearly
  irreversible: once formalized, coordination rarely reverts to informality even
  when the stress has passed.
type: lifecycle
confidence: candidate
domains:
  - "organizational: startup informality → corporate procedure under growth pressure"
  - "legal: customary international law → codified treaty regimes"
  - "medical: clinical judgment → evidence-based protocol under malpractice pressure"
  - "software: informal API conventions → versioned, documented specifications under dependency scaling"
  - "financial: handshake deals → written contracts under transaction scale"
related_laws:
  - L-001  # ossification follows formalization
mechanism: >
  Informal coordination works through shared context and trust, which has carrying
  capacity limits. Under stress (conflict, scale, turnover), the shared context
  degrades or becomes contested. Explicit protocols substitute for shared context:
  they work without trust and without shared background knowledge. Once in place,
  the informal capacity atrophies — people stop developing the contextual knowledge
  and trust that made informality work. Reversion requires rebuilding this capacity
  under conditions (post-formalization) that are hostile to its development.
falsification_conditions: >
  Documented cases of organizations successfully reverting from formal protocol to
  informal coordination after the stressor passed would constitute counterexamples.
  Anecdotal cases exist (small teams post-crisis returning to informal norms) but
  tend to involve personnel turnover that resets the social substrate.
counterexamples:
  - >
    Post-crisis informality is sometimes observed in tight-knit teams, but typically
    only when the formal protocol was externally imposed (rather than internally developed)
    and the team retains continuity of personnel and shared context.
evidence: []
notes: >
  This is a directional law, not an absolute one. Partial reversions occur.
  The claim is about tendency and asymmetry, not strict irreversibility.
  The ratchet metaphor: it clicks forward easily but resists backward motion.
registered: "2026-05-20"
