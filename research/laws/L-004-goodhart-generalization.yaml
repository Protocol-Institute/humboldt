id: "L-004"
name: "Goodhart Generalization: Metric Capture"
statement: >
  Any protocol that uses a measurable proxy for an unmeasurable goal will, under
  sufficient optimization pressure, cause participants to optimize the proxy in ways
  that degrade the underlying goal. The degree of degradation is proportional to
  the optimization pressure and inversely proportional to the gap between the proxy
  and the goal.
type: failure
confidence: established
domains:
  - "economic: GDP as proxy for welfare; test scores as proxy for learning"
  - "medical: clinical trial endpoints vs. actual patient outcomes"
  - "software: code coverage as proxy for test quality"
  - "social: citation counts as proxy for research quality"
  - "financial: VaR as proxy for risk (optimized away the fat tails)"
  - "governmental: crime statistics as proxy for safety (Compstat effects)"
related_laws: []
mechanism: >
  Measurable proxies are, by definition, imperfect representations of underlying goals.
  The gap between proxy and goal defines the exploitation surface: behavior that
  maximizes the proxy while degrading the goal. Under optimization pressure (incentive
  structures, competition, survival pressure), participants with agency will discover
  and exploit this surface. The proxy becomes the de facto goal. Goodhart (1975)
  stated this for monetary policy targets; the pattern is universal to any
  optimization-under-protocol regime.
falsification_conditions: >
  A protocol using measurable proxies under sustained optimization pressure that
  did NOT experience metric capture would constitute a counterexample. Likely
  candidates involve proxies that are near-perfect representations of the underlying
  goal — but such cases approach the definitional boundary where the proxy IS the goal.
counterexamples:
  - >
    Some metrics resist capture because gaming them requires achieving the actual goal
    (e.g., in some competitive domains, the only way to win the metric is to win the
    underlying contest). These are not counterexamples but rather well-designed protocols.
evidence: []
notes: >
  Goodhart's Law as originally stated: "When a measure becomes a target, it ceases
  to be a good measure." This formulation extends it to the structural conditions
  that determine the rate and magnitude of degradation. The "optimization pressure"
  term is key: low-stakes proxy use is relatively safe; high-stakes proxy use
  under competition is reliably toxic.
registered: "2026-05-20"
