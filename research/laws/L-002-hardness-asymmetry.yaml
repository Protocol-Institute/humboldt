id: "L-002"
name: "Hardness Asymmetry"
statement: >
  In any protocol with a verification function and an execution or forgery function,
  the verification cost and the circumvention cost are structurally decoupled and can
  differ by arbitrary orders of magnitude. Protocol robustness is determined by this
  ratio, not by the absolute cost of either function alone.
type: hardness
confidence: established
domains:
  - "cryptographic: public-key infrastructure (verification O(n), forgery computationally infeasible)"
  - "legal: tort law (filing a complaint is cheap; defending is expensive — asymmetry inverted)"
  - "social: reputation systems (earning reputation costly; verifying cheaply)"
  - "financial: fraud detection (verifying a transaction cheap; constructing undetected fraud costly)"
  - "biological analogy: immune recognition (self/non-self discrimination cheap; evading immune system costly for pathogens)"
related_laws:
  - L-001  # ossified protocols are harder to circumvent but also harder to modify
mechanism: >
  The verification and circumvention functions are not inverses of each other.
  They exploit different mathematical or social structures. Public-key cryptography
  exploits the asymmetry of trapdoor one-way functions. Social reputation exploits
  the asymmetry between social memory (cheap, distributed) and behavior change
  (costly, personal). The asymmetry is a design resource: protocols can be engineered
  to maximize the circumvention/verification ratio.
falsification_conditions: >
  A protocol where the circumvention cost and verification cost converge would
  constitute a counterexample — such protocols exist (simple passwords, easily
  guessed) but they represent design failures, not counterexamples to the law.
  The law claims that the asymmetry is achievable and structurally significant,
  not that it is universal. Protocols that fail to achieve it are simply soft.
counterexamples: []
evidence: []
notes: >
  This law is partially named in the c3po SOUL.md under "hardness matters."
  The novel contribution here is framing hardness as a ratio (verification/circumvention)
  rather than an absolute property, and noting that the ratio can be engineered.
  The "inverted hardness" case (legal harassment) is underexplored in the PI corpus.
project_file: "research/projects/P-002-hardness-asymmetry.md"
registered: "2026-05-20"
