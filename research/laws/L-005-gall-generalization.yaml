id: "L-005"
name: "Gall Generalization: Working Systems Resist Restructuring"
statement: >
  A complex protocol system that functions correctly cannot be safely redesigned
  from scratch; it must be evolved from a simpler working system. Attempts to
  design complex protocol systems directly, without evolutionary derivation from
  working simpler predecessors, reliably fail.
type: evolution
confidence: established
domains:
  - "software: failed big-bang rewrites (Netscape, FoxPro, many others)"
  - "organizational: top-down institutional redesigns vs. evolutionary reform"
  - "regulatory: comprehensive regulatory frameworks designed from scratch vs. incremental refinement"
  - "urban: high-modernist planned cities (Brasilia, Chandigarh) vs. evolved cities"
  - "financial: designed clearing systems vs. evolved settlement conventions"
related_laws:
  - L-001  # ossified working systems are hard to replace precisely because they work
  - L-003  # formalization ratchet — formalized systems resist reversion and redesign
mechanism: >
  Working complex systems have embedded in them a large number of implicit solutions
  to problems that are not visible in their specification. These solutions accumulate
  through use and adaptation — they are not designed but evolved. A redesign from
  scratch must solve all these problems simultaneously, without the evolutionary process
  that discovered them one at a time in context. The designer cannot know what all the
  problems are until the system is deployed and fails. Gall (1975) observed this for
  systems generally; it is especially acute for protocols because protocol systems
  must coordinate behavior across many independent agents, each of whom has adapted
  to the existing protocol in ways they cannot fully articulate.
falsification_conditions: >
  A successful from-scratch replacement of a complex working protocol system would
  constitute a counterexample. The IPv4 → IPv6 transition is a long-running attempt;
  its multi-decade timeline and continued coexistence (rather than replacement) may
  support rather than falsify the law.
counterexamples:
  - >
    Some from-scratch replacements succeed when the old system is sufficiently small,
    well-understood, and the replacement can be deployed in a controlled rollout
    (e.g., internal corporate systems). Scale and distribution are the key conditions.
evidence: []
notes: >
  Gall's original formulation: "A complex system that works is invariably found to
  have evolved from a simple system that worked... A complex system designed from
  scratch never works and cannot be patched up to make it work. You have to start
  over with a working simple system."

  This is one of the strongest candidate laws in the inventory — multiply attested
  across radically independent domains.
project_file: "research/projects/P-005-gall-import.md"
registered: "2026-05-20"
