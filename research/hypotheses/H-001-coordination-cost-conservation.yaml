id: "H-001"
question: "Is coordination cost conserved across protocol layer transitions?"
motivation: >
  Protocol systems are often redesigned to simplify one layer of coordination.
  But practitioners frequently observe that the complexity "moves" rather than
  disappears — a simpler protocol at one layer produces harder problems at the
  layer above or below. If true, this would constitute a conservation law:
  total coordination cost in a system is conserved, and protocol design redistributes
  rather than eliminates it.

  Analogy: thermodynamics teaches us that energy is conserved — you cannot build
  a perpetual motion machine. The hypothesis is that coordination cost is similarly
  conserved — you cannot build a protocol that eliminates coordination cost, only
  one that moves it.
related_laws:
  - L-001  # ossification — cost of coordination around change
  - L-003  # formalization ratchet — formalizing shifts burden to maintenance
retrieval_queries:
  - "coordination cost protocol complexity tradeoff"
  - "simplification shifting burden adjacent layers"
  - "protocol complexity redistribution"
  - "invisible coordination cost formalization"
  - "transaction cost protocol design"
status: active
notes: >
  The strongest test would be: find a protocol redesign that provably reduced total
  system coordination cost (not just moved it), sustained over time after full adoption.
  The OSI model / TCP-IP comparison may be relevant — TCP-IP is "simpler" in some
  respects but the simplicity pushed complexity to the application layer.
